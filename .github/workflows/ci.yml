name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  headers:
    name: SPDX license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX headers
        run: bash scripts/check-headers.sh

  compose:
    name: docker-compose validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f docker-compose.yml config --quiet

  go-api:
    name: Go API builds and tests
    runs-on: ubuntu-latest
    # Integration tests (db, users, cmd/api) run against this real
    # PostgreSQL when TEST_DATABASE_URL is set; without it they skip
    # gracefully, so the unit tests still run everywhere.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  elixir-chat:
    name: Elixir chat compiles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/chat
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
