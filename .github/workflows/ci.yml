name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  headers:
    name: SPDX license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX headers
        run: bash scripts/check-headers.sh

  openapi:
    name: OpenAPI spec validates
    runs-on: ubuntu-latest
    # Gates C2: docs/openapi.yaml must lint clean (redocly.yaml documents
    # the two deliberately-disabled rules) so the spec stays in sync.
    # Gates G4 part 1: the spec is the single source of truth — the
    # coverage gate fails the build if any registered route is
    # undocumented, any spec path is stale, or an internal route leaks
    # into the public spec.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli@latest lint docs/openapi.yaml
      - name: OpenAPI coverage gate (single source of truth)
        run: python3 scripts/check_openapi_coverage.py

  compose:
    name: docker-compose validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build API production image
        # Gates A8: the hardened Dockerfile must build on every push.
        run: docker build -f services/api/Dockerfile services/api
      - name: Build chat production image
        # Gates B7: the release-based Dockerfile must build on every push
        # (`mix release` runs inside; full local compile is CI-gated).
        run: docker build -f services/chat/Dockerfile services/chat
      - name: Build transcode worker image
        # Gates D4b: the worker image (Go + FFmpeg) must build on every push.
        run: docker build -f services/api/Dockerfile.worker services/api
      - name: Build AI service image
        # Gates E1: the Python AI service image must build on every push
        # (pip install of the pinned requirements runs inside).
        run: docker build -f services/ai/Dockerfile services/ai
      - name: Build caption worker image
        # Gates E3: the faster-whisper worker image must build on every
        # push (pip install of requirements-caption.txt runs inside).
        run: docker build -f services/ai/Dockerfile.caption services/ai

  smoke:
    name: Full-stack smoke test
    runs-on: ubuntu-latest
    # Gates C1 + D1: boots the whole compose stack (postgres, valkey,
    # seaweedfs, hydra, kratos, api, chat), runs chat migrations, then
    # exercises the API (/healthz, /readyz, /v1/me), a real Hydra-issued
    # JWT against /v1/me with the auth bypass OFF (proving the A2 JWKS
    # verification path against a real OIDC issuer), and a websocket
    # send/receive round-trip with reconnect-history verification.
    # The script tears the stack down afterwards; basic API checks use
    # AUTH_BYPASS=1 (dev-only hatch), the D1 loop does not.
    steps:
      - uses: actions/checkout@v4
      - name: Boot stack and run smoke tests
        run: bash scripts/smoke.sh

  go-api:
    name: Go API builds and tests
    runs-on: ubuntu-latest
    # Integration tests (db, users, cmd/api) run against this real
    # PostgreSQL when TEST_DATABASE_URL is set; without it they skip
    # gracefully, so the unit tests still run everywhere.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: HTTP benchmarks (short)
        # Gates C4: the benchmarks compile and run; numbers print to the
        # log (baselines live in docs/benchmarks.md). Short benchtime
        # keeps CI fast; full runs are manual (see the doc).
        run: go test -run='^$' -bench=. -benchtime=2s -count=1 ./cmd/api/... ./internal/middleware/... ./internal/social/...

  python-ai:
    name: Python AI service tests
    runs-on: ubuntu-latest
    # Gates E1-E6: the AI service's unit tests (guard logic, graph wiring,
    # formatters, budget/translate math) run on every push. DB-backed
    # behavior is covered by the smoke job and live-service tests.
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run unit tests
        # app/config.py refuses to import without AI_SERVICE_TOKEN and
        # DATABASE_URL (fail-closed boot). The unit tests never touch a
        # real database or the network (fake pools / stub backends), so
        # dummy values are safe here — production still refuses to boot
        # without real ones.
        env:
          AI_SERVICE_TOKEN: ci-unit-test-dummy-token
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/sutra_ci_unit
        run: python -m pytest tests/ -q
      - name: Validate eval golden set
        # The eval harness skeleton's golden files must at least parse
        # (real eval runs stay manual until Wave 2).
        run: python eval/run_eval.py --dry-run

  elixir-chat:
    name: Elixir chat builds and tests
    runs-on: ubuntu-latest
    # Channel tests (B6) run against this real PostgreSQL: config/test.exs
    # uses DATABASE_URL when set, so `mix ecto.create/migrate` + `mix test`
    # exercise the real Repo (persist/dedupe/history) via the Ecto sandbox.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sutra_chat_test?sslmode=disable
    defaults:
      run:
        working-directory: services/chat
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      # ecto.create/migrate MUST run in MIX_ENV=test: `mix test` reads
      # config/test.exs, which points the Repo at the DATABASE_URL database
      # (sutra_chat_test). Running them in the default dev env creates and
      # migrates sutra_chat_dev instead, and every DB-touching channel test
      # then fails with "database sutra_chat_test does not exist".
      - run: MIX_ENV=test mix ecto.create
      - run: MIX_ENV=test mix ecto.migrate
      - run: mix test
