# Ory Kratos configuration for the Sutra dev compose stack (D1).
#
# This is a DEVELOPMENT config. The cookie/cipher secrets below are clearly
# marked dev-only placeholders — production must mount its own kratos.yml
# with generated secrets (see docs/identity.md and docs/production.md).
# Never commit production secrets here.
#
# What this enables in Wave 1:
#   - Self-service identity store (email+password credentials) on the shared
#     Postgres, reachable at http://localhost:4433 (public) / :4434 (admin).
#   - A foundation Hydra's login/consent flow will point at once a login UI
#     exists (URLS_LOGIN/URLS_CONSENT in docker-compose.yml are placeholders
#     until then; only client_credentials M2M flows are exercised today).
#   - Courier (email delivery) is intentionally unconfigured: no verification
#     or recovery emails are sent in dev. Wiring a real mailer is a
#     post-incorporation step alongside SMS/DLT (see docs/identity.md).

dsn: postgres://sutra:sutra@postgres:5432/kratos?sslmode=disable

serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: true
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://localhost:4433/
  allowed_return_urls:
    - http://localhost:4433

  methods:
    password:
      enabled: true

  # Browser UI placeholders: no login/registration UI ships in Wave 1, so
  # these point at the public base URL and are documented as future work in
  # docs/identity.md. API-only flows (what D2+ will use) do not need them.
  flows:
    login:
      ui_url: http://localhost:4433/login
    registration:
      ui_url: http://localhost:4433/registration
    settings:
      ui_url: http://localhost:4433/settings
    recovery:
      ui_url: http://localhost:4433/recovery
    verification:
      ui_url: http://localhost:4433/verification
    # OTP (SMS) method stays DISABLED until DLT registration exists
    # post-incorporation. Enabling it with the stub sender would fake
    # deliveries, which the fail-closed design forbids.

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

# DEV-ONLY secrets. Production MUST replace this file (or at least these
# values) with generated secrets that never enter version control.
# Shapes are pinned by the v26.2.0 config schema (validated 2026-10-19):
# cipher secrets must be EXACTLY 32 chars, cookie/pagination >= 16.
secrets:
  cookie:
    - dev-only-kratos-cookie-secret-32c-min-abcdef
  cipher:
    - dev-only-kratos-cipher-32bytes!!
  # CVE-2026-33503: pagination tokens are encrypted with this secret; the
  # vendor default is publicly known, so a custom value is required.
  pagination:
    - dev-only-kratos-pagination!

# Kratos names this section `hashers` (plural) — `hash` is an unknown key
# and newer Kratos releases refuse to boot on unknown config keys, which
# killed the kratos-migrate one-shot in CI (smoke red 2026-10-19).
# NOTE: hashers.argon2.memory must be a byte STRING ("64MB"), not an
# integer — v26's schema rejects `memory: 65536`, which kept `kratos serve`
# from booting in CI (smoke red 2026-10-19, triage #5).
hashers:
  argon2:
    # Dev-tuned: fast enough for laptop iteration, still Argon2id.
    memory: "64MB"
    iterations: 2
    parallelism: 2
