# Sutra dev stack — one command: docker compose up
# Every dependency a contributor needs on their laptop. No managed services.
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: sutra
      POSTGRES_PASSWORD: sutra
      POSTGRES_DB: sutra
    ports: ["5432:5432"]
    # pg18+ images store data in a versioned subdirectory and REFUSE to
    # start when the old /var/lib/postgresql/data mount is used (the
    # entrypoint mistakes the mount for a pre-18 data directory — this
    # broke the CI smoke job 2026-10-18). Mount the parent instead, per
    # the image's own guidance.
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sutra"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10

  # Commerce search (F2): Meilisearch CE (MIT), pinned. The Go API
  # indexes product documents on write (internal/search); indexing is
  # best-effort, so the API boots fine with this service down.
  # MEILI_MASTER_KEY is a DEV default — production must override it
  # (docs/production.md). No healthcheck: the image ships no curl and
  # the API never blocks on search, so none is needed.
  meilisearch:
    image: getmeili/meilisearch:v1.38.0
    ports: ["7700:7700"]
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-sutra-dev-master-key}
    volumes: [meili_data:/meili_data]

  seaweedfs:
    image: chrislusf/seaweedfs:3.92
    command: "server -dir=/data -volume.max=10 -master.volumeSizeLimitMB=1024 -ip=seaweedfs"
    ports: ["9333:9333", "8080:8080"]
    volumes: [weeddata:/data]

  # Identity (D1): Ory Hydra (OAuth2/OIDC issuer) + Ory Kratos (self-service
  # identity store). The Go API verifies Hydra-issued RS256 tokens through
  # the existing A2 JWKS path — no new auth code, Hydra is simply the real
  # issuer now. See docs/identity.md. DEV SECRETS below are placeholders;
  # production must override them (docs/production.md).
  hydra-migrate:
    image: oryd/hydra:v26.2.0
    environment:
      DSN: "postgres://sutra:sutra@postgres:5432/sutra?sslmode=disable"
    command: migrate sql -e --yes
    depends_on:
      postgres:
        condition: service_healthy

  hydra:
    image: oryd/hydra:v26.2.0
    # --dev: development defaults (no TLS requirement). Production serves
    # behind TLS termination with an explicit config file instead.
    command: serve all --dev
    ports: ["4444:4444", "4445:4445"]
    environment:
      DSN: "postgres://sutra:sutra@postgres:5432/sutra?sslmode=disable"
      # DEV-ONLY: must be identical across restarts (it encrypts the DB).
      # Generate a real one for production; never commit it.
      SECRETS_SYSTEM: "dev-only-secret-change-in-production-0123456789ab"
      # The iss claim the API/chat verifiers expect (HYDRA_ISSUER below).
      URLS_SELF_ISSUER: "http://hydra:4444"
      # No login/consent UI ships in Wave 1 — these are placeholders until
      # a Kratos-backed login app exists. Only client_credentials (M2M)
      # flows are exercised today, which need neither.
      URLS_LOGIN: "http://localhost:4433/self-service/login/browser"
      URLS_CONSENT: "http://localhost:4433/self-service/consent/browser"
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    environment:
      DSN: "postgres://sutra:sutra@postgres:5432/sutra?sslmode=disable"
    command: migrate sql -e --yes --config /etc/config/kratos/kratos.yml
    volumes:
      - ./services/identity/kratos:/etc/config/kratos:ro
    depends_on:
      postgres:
        condition: service_healthy

  kratos:
    image: oryd/kratos:v26.2.0
    command: serve --config /etc/config/kratos/kratos.yml
    ports: ["4433:4433", "4434:4434"]
    environment:
      DSN: "postgres://sutra:sutra@postgres:5432/sutra?sslmode=disable"
    volumes:
      - ./services/identity/kratos:/etc/config/kratos:ro
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully

  # Sutra services
  # AI core (E1): the Python intelligence layer. Never serves user clients
  # directly — the Go API proxies /v1/ai/* to it with AI_SERVICE_TOKEN
  # (see docs/ai-core.md). The service fails closed at boot without the
  # token; scripts/smoke.sh generates an ephemeral one, production must
  # set a long random secret. Exposed on host 8000 for local debugging;
  # a production override should drop the ports mapping.
  ai:
    build: ./services/ai
    ports: ["8000:8000"]
    environment:
      PORT: "8000"
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      DATABASE_URL: "postgres://sutra:sutra@postgres:5432/sutra?sslmode=disable"
      OLLAMA_BASE_URL: "http://ollama:11434"
      AI_MODEL: "sarvam-30b"
      # Test/dev overrides (compose interpolation; the smoke script uses
      # these to exercise the stub model and the guard 429 paths in CI):
      AI_MODEL_STUB: "${AI_MODEL_STUB:-0}"
      AI_DAILY_TOKEN_BUDGET: "${AI_DAILY_TOKEN_BUDGET:-50000}"
      AI_CHAT_RPM: "${AI_CHAT_RPM:-20}"
      # E6 abuse guard: per-user fixed-window rate limit on /ag-ui/run
      # (the echo endpoint costs no model tokens but was unbounded before
      # E6). Over the cap → 429 ai_rate_limited + Retry-After.
      AI_AGUI_RPM: "${AI_AGUI_RPM:-60}"
      AI_MAX_HISTORY: "${AI_MAX_HISTORY:-30}"
      AI_PROMPT_VERSION: "${AI_PROMPT_VERSION:-v1}"
      # Language bridge (E4): Valkey cache + rate limits are REQUIRED —
      # the ai service refuses to boot without VALKEY_ADDR reachable.
      VALKEY_ADDR: "valkey:6379"
      TRANSLATE_BACKEND: "${TRANSLATE_BACKEND:-indictrans2}"
      TRANSLATE_MODEL_SIZE: "${TRANSLATE_MODEL_SIZE:-dist-200M}"
      TRANSLATE_RPM: "${TRANSLATE_RPM:-30}"
    # No depends_on: the API degrades /v1/ai/* to 503 when the token is
    # empty or the service is down, so boot order must not couple them.
    # (The ai service itself refuses to boot without DATABASE_URL — it
    # crash-loops until postgres is up, same as the Go API.)

  # Dev model runtime for the AI service (E2 calls it via the
  # OpenAI-compatible /v1/chat/completions endpoint). Pull a model once
  # after first boot:
  #   docker compose exec ollama ollama pull sarvam-30b
  # Production replaces this with vLLM (docs/ai-core.md) — the service
  # talks OpenAI-compatible chat completions either way.
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama-data:/root/.ollama]

  chat:
    build: ./services/chat
    ports: ["4000:4000"]
    environment:
      MIX_ENV: prod
      DATABASE_URL: "postgres://sutra:sutra@postgres:5432/sutra?sslmode=disable"
      # B7: the chat image is a `mix release` now. It fails closed at boot
      # without a real SECRET_KEY_BASE (the dev key baked into config.exs
      # is never used). Generate one and keep it out of git:
      #   mix phx.gen.secret
      # SECRET_KEY_BASE: "paste-generated-value-here"
      # (scripts/smoke.sh generates an ephemeral one automatically.)
      AUTH_BYPASS: ${AUTH_BYPASS:-}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      # First boot of a fresh database (migrations live in the release,
      # `mix` does not — see SutraChat.Release):
      #   docker compose run --rm chat /app/bin/sutra_chat eval "SutraChat.Release.migrate()"
      # Same identity contract as the API service (docs/auth-contract.md).
      # Hydra now runs in this compose file (D1); the verifier fails closed
      # when Hydra is unreachable (socket connects are refused, like the
      # API's 401s).
      HYDRA_ISSUER: "http://hydra:4444"
      JWT_AUDIENCE: "sutra-api"
      # D5 realtime social events: the API POSTs post:new / follower:new
      # envelopes to this service's POST /internal/events with this value
      # as the Bearer token (compared in constant time). Empty = the
      # endpoint 401s everything (fail-closed). smoke.sh generates an
      # ephemeral value; production must set a long random secret.
      # Internal network only — never expose this endpoint publicly.
      CHAT_INTERNAL_TOKEN: ${CHAT_INTERNAL_TOKEN:-}
      # Multi-node presence clustering (B5, docs/presence.md): opt-in.
      # Single chat replica needs nothing. For >1 chat node, releases (B7)
      # honor RELEASE_NODE/RELEASE_COOKIE natively — set CLUSTER_ENABLED=1
      # on every chat replica plus a shared RELEASE_COOKIE and a unique
      # RELEASE_NODE per replica (e.g. sutra-chat@10.0.0.2).
      # CLUSTER_ENABLED: "1"
      # CLUSTER_SECRET: "change-me-in-prod"
      # RELEASE_COOKIE: "change-me-in-prod"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./services/api
    # NOTE: the container listens on 8080 internally (PORT env); the host
    # port is 8081 because SeaweedFS's filer already owns host 8080 above.
    ports: ["8081:8080"]
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://sutra:sutra@postgres:5432/sutra?sslmode=disable"
      VALKEY_ADDR: "valkey:6379"
      # Identity (D1): Hydra is the real OIDC issuer now. The API verifies
      # Hydra-issued RS256 JWTs through the A2 JWKS path: iss must equal
      # Hydra's URLS_SELF_ISSUER, aud the audience requested at token time
      # (scripts/smoke.sh requests "sutra-api").
      HYDRA_ISSUER: "http://hydra:4444"
      HYDRA_JWKS_URL: "http://hydra:4444/.well-known/jwks.json"
      JWT_AUDIENCE: "sutra-api"
      # Phone-OTP SMS gateway (D1): only "stub" exists until DLT
      # registration post-incorporation. Any other value makes the API
      # refuse to boot (fail-closed) — see internal/otp + docs/identity.md.
      OTP_PROVIDER: "stub"
      # Dev-only auth bypass for scripts/smoke.sh (the API logs a loud
      # WARN when this is set; never enable in production).
      AUTH_BYPASS: ${AUTH_BYPASS:-}
      # Velocity abuse guards (D6): posts/hour and new-follows/hour.
      # Empty (the default) means the Go defaults apply (30 / 200).
      # scripts/smoke.sh tightens them to 1 for its D6 429 assertions.
      POST_VELOCITY_PER_HOUR: ${POST_VELOCITY_PER_HOUR:-}
      FOLLOW_VELOCITY_PER_HOUR: ${FOLLOW_VELOCITY_PER_HOUR:-}
      # Realtime social events (D5): the chat service's internal signed
      # endpoint. URL default is the compose service name; the token is
      # empty by default, which DISABLES eventing (dev default — the API
      # logs a WARN at startup). Set CHAT_INTERNAL_TOKEN to a long random
      # secret (same value as the chat service's) to enable post:new /
      # follower:new delivery. Never commit a real token here.
      CHAT_INTERNAL_URL: "http://chat:4000"
      CHAT_INTERNAL_TOKEN: ${CHAT_INTERNAL_TOKEN:-}
      # AI core (E1): the Python AI service. The API proxies /v1/ai/* to
      # AI_SERVICE_URL with AI_SERVICE_TOKEN as the Bearer credential
      # (same value as the ai service's). Empty token = /v1/ai/* returns
      # 503 ai_unavailable; a token with a bad URL refuses boot. Never
      # commit a real token here.
      AI_SERVICE_URL: "http://ai:8000"
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      # Commerce search (F2 part 1): Meilisearch product indexing.
      # SEARCH_URL defaults to the compose service above; empty master
      # key DISABLES indexing (dev default — the API logs a WARN).
      # Set SEARCH_MASTER_KEY to the same value as MEILI_MASTER_KEY to
      # enable product search. Never commit a real key here.
      SEARCH_URL: "http://meilisearch:7700"
      SEARCH_MASTER_KEY: ${SEARCH_MASTER_KEY:-}
      # Payments (F4 part 1): payment-aggregator seam. Only "stub" boots
      # until the Cashfree onboarding completes post-investors — any other
      # PAYMENTS_PROVIDER makes the API refuse to boot (fail-closed), and
      # every operation on the stub is a typed error, never a charge.
      # CASHFREE_APP_ID/SECRET_KEY/ENV are the future live credentials:
      # loaded, never logged, never committed; the stub ignores them
      # (and warns loudly if they are set).
      PAYMENTS_PROVIDER: "stub"
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_ENV: ${CASHFREE_ENV:-}
      # Logistics (F5 part 1): logistics-gateway seam. Only "stub" boots
      # until a logistics partner is onboarded post-investors — any other
      # LOGISTICS_PROVIDER makes the API refuse to boot (fail-closed), and
      # every operation on the stub is a typed error, never a booking.
      # LOGISTICS_API_KEY/SECRET/ENV are the future live credentials:
      # loaded, never logged, never committed; the stub ignores them
      # (and warns loudly if they are set).
      LOGISTICS_PROVIDER: "stub"
      LOGISTICS_API_KEY: ${LOGISTICS_API_KEY:-}
      LOGISTICS_SECRET: ${LOGISTICS_SECRET:-}
      LOGISTICS_ENV: ${LOGISTICS_ENV:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Transcode worker (D4b): background HLS video pipeline. Drains the
  # `media:transcode` Valkey stream (fed by the API's media registry),
  # pulls each source clip from SeaweedFS, builds per-rendition HLS
  # packages + a poster frame with FFmpeg, uploads the outputs back,
  # and flips the media row to ready (or failed after TRANSCODE_MAX_ATTEMPTS,
  # with the job parked on the media:transcode:dead stream). Runs one
  # replica in dev; scale replicas freely — the consumer group
  # (TRANSCODE_GROUP/transcode-workers, TRANSCODE_CONSUMER=hostname by
  # default) distributes jobs across them. Like the API it refuses to boot
  # without PostgreSQL and Valkey; SeaweedFS is warn-only at startup
  # (a dead volume server fails individual jobs through the retry/DLQ
  # machinery instead of the whole worker).
  transcode-worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: "postgres://sutra:sutra@postgres:5432/sutra?sslmode=disable"
      VALKEY_ADDR: "valkey:6379"
      # Object storage: master for dir/assign, volume base for reads.
      SEAWEEDFS_MASTER_ADDR: "seaweedfs:9333"
      MEDIA_PUBLIC_BASE_URL: "http://seaweedfs:8080"
      # Tuning knobs (internal/config defaults apply when unset):
      # TRANSCODE_GROUP / TRANSCODE_CONSUMER / TRANSCODE_MAX_ATTEMPTS /
      # TRANSCODE_BACKOFF_BASE / TRANSCODE_BACKOFF_MAX /
      # TRANSCODE_SWEEP_INTERVAL
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_started

  # Auto-caption worker (E3 part 2): faster-whisper on CPU. Separate
  # image from the FastAPI AI service (Dockerfile.caption) so the
  # whisper stack never bloats the chat API. The model cache is a named
  # volume (first boot downloads the model; restarts reuse it).
  # Consumer-group semantics: replicas split media:captions jobs; the
  # claim UPDATE in the media table makes redelivery safe. Liveness:
  # worker:captions:heartbeat (TTL'd) — compose/k8s probe it.
  caption-worker:
    build:
      context: ./services/ai
      dockerfile: Dockerfile.caption
    environment:
      DATABASE_URL: "postgres://sutra:sutra@postgres:5432/sutra?sslmode=disable"
      VALKEY_ADDR: "valkey:6379"
      # Object storage: master for dir/assign, volume base for reads.
      SEAWEEDFS_MASTER_ADDR: "seaweedfs:9333"
      MEDIA_PUBLIC_BASE_URL: "http://seaweedfs:8080"
      # Tuning knobs (app/captions.py defaults apply when unset):
      # CAPTION_MODEL / CAPTION_GROUP / CAPTION_CONSUMER /
      # CAPTION_MAX_ATTEMPTS / CAPTION_BACKOFF_BASE / CAPTION_BACKOFF_MAX /
      # CAPTION_SWEEP_INTERVAL / CAPTION_WORK_DIR / CAPTION_MODEL_DIR
    volumes:
      - whisper-models:/srv/ai/models/whisper
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_started

volumes:
  pgdata:
  weeddata:
  meili_data:
  ollama-data:
  whisper-models:
