# Sutra dev stack — one command: docker compose up
# Every dependency a contributor needs on their laptop. No managed services.
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: sutra
      POSTGRES_PASSWORD: sutra
      POSTGRES_DB: sutra
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sutra"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:3.92
    command: "server -dir=/data -volume.max=10 -master.volumeSizeLimitMB=1024 -ip=seaweedfs"
    ports: ["9333:9333", "8080:8080"]
    volumes: [weeddata:/data]

  # Auth plumbing (Wave-1): Ory Kratos + Hydra — added by issue #4
  # kratos:
  # hydra:

  # Sutra services (scaffolds — see issues #4, #5)
  chat:
    build: ./services/chat
    ports: ["4000:4000"]
    environment:
      MIX_ENV: prod
    depends_on:
      - postgres

  api:
    build: ./services/api
    ports: ["8080:8080"]
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://sutra:sutra@postgres:5432/sutra?sslmode=disable"
      VALKEY_ADDR: "valkey:6379"
    depends_on:
      - postgres
      - valkey

volumes:
  pgdata:
  weeddata:
