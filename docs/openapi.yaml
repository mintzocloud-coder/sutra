  /v1/integrations/zoho/invoices:
    post:
      tags: [integrations]
      summary: Create a Zoho Books invoice (seller-scoped)
      description: |
        Creates a customer invoice in Zoho Books against a contact.
        Seller-scoped: the caller must own a seller account
