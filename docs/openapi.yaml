  /v1/posts:
    post:
      tags: [posts]
      summary: Publish a post
      description: |
        Publishes a post as the caller. Body text is capped at 500 runes
        (measured in runes, not bytes, so emoji-heavy posts are measured
        fairly); blank bodies are 422. media_ids are validated for shape
        (`[A-Za-z0-9_-]{1,128}`, max 10 per post) — the readiness gate
        ("reference only ready media") is enforced by the media pipeline
        (D4), not here. A per-author rolling velocity cap applies (default
        30 posts/hour, `POST_VELOCITY_PER_HOUR`): over the cap is 429
        `post_velocity_limited` with a Retry-After header telling the
        client when the oldest post in the window ages out.
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreate'
            example:
              text: Shipping the Wave 1 feed today.
              media_ids: []
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed JSON body or unknown field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: Wrong method — this route only supports POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: POST
        '422':
          description: |
            Validation failure — `empty_post` (blank body), `post_too_long`
            (>500 runes), `too_many_media` (>10), or `invalid_media_id`
            (grammar).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          description: |
            Over the per-author velocity cap (error code
            "post_velocity_limited"); the Retry-After header carries the
            wait in seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Retry-After:
              description: Seconds until the oldest post in the rolling window ages out
              schema:
                type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/posts/{id}:
    delete:
      tags: [posts]
      summary: Delete a post
      description: |
        Deletes a post. Author-only: 403 `post_not_author` when the caller
        is not the author; 404 `post_not_found` for unknown ids (deleting
        an already-gone post is a client bug worth surfacing, unlike the
        idempotent unfollow).
      operationId: deletePost
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '204':
          description: Post deleted
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed post id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the post's author.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '404':
          description: No such post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '405':
          description: Wrong method — this route only supports DELETE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: DELETE
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/posts/{id}/like:
    post:
      tags: [posts, engagement]
      summary: Like a post
      description: |
        Records the caller's like. Idempotent: liking twice is a no-op
        (201 first time, 200 on retry — mirroring follow). Likes are the
        engagement signal feeding the v1 home-feed ranker (docs/recsys.md).
      operationId: likePost
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '201':
          description: Post liked (first time).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeResult'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '200':
          description: Already liked (idempotent retry); current count returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeResult'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed post id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '405':
          description: Wrong method — this route only supports POST and DELETE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: POST, DELETE
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [posts, engagement]
      summary: Unlike a post
      description: |
        Removes the caller's like. Idempotent "ensure absent": unliking an
        unliked (or unknown) post is a no-op success — 200 with the current
        count so clients can update UI state without a refetch.
      operationId: unlikePost
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
