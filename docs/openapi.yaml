          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/media/upload:
    post:
      tags: [media]
      summary: Start a media upload
      description: |
        Mints a media row and returns a direct SeaweedFS PUT URL
        ("presigned" here means pre-assigned: no signature or expiry —
        security comes from unguessable fids, the status lifecycle, and
        the network boundary). Bytes go straight to SeaweedFS and never
        through the API. The row starts `pending`; the client PUTs its
        file, then calls `/v1/media/{id}/complete`. Storage-master
        outages are 503 `media_unavailable` with Retry-After.
      operationId: createMediaUpload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadRequest'
            example:
              kind: video
              filename: clip.mp4
              mime_type: video/mp4
      responses:
        '201':
          description: Upload session minted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed JSON body or unknown field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: |
            `invalid_media_kind` (kind not video/image),
            `invalid_mime_type` (mime must start with the kind, e.g.
            video/mp4), `invalid_filename` (1–255 bytes, no path
            separators).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: |
            `media_unavailable` — the storage master is unreachable.
            Retriable; carries Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'

  /v1/media/{id}:
    get:
      tags: [media]
      summary: Get one media record
      description: |
        Returns the media row, including lifecycle status. Clients poll
        this while a video transcodes (status `uploaded` → `ready` or
        `failed`). Media ids are unguessable UUIDs and rows carry no
        PII, so any authenticated user may read.
      operationId: getMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: The media record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Media id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No media with that id (`media_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/media/{id}/complete:
    post:
      tags: [media]
      summary: Mark an upload complete
      description: |
        Called after the client PUT its bytes to the upload URL. The
        API HEADs the file on SeaweedFS to confirm bytes landed (size
        > 0): images go straight to `ready`; videos go to `uploaded`
        and are enqueued for the transcode worker (D4 part 2). Re-
        completing a finished upload is 409 `upload_already_completed`;
        completing someone else's upload is 403 `media_not_owned`.
      operationId: completeMediaUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Media advanced to its next status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Media id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The media belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '404':
          description: No media with that id (`media_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '409':
          description: Upload already completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '422':
          description: |
            `upload_bytes_missing` — no bytes found at the upload URL;
            PUT the file first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/live/token:
    post:
      tags: [live]
      summary: Mint a LiveKit participant token
      description: |
        Issues a room-scoped, short-lived LiveKit participant JWT for
        the given room (G1, Wave 4). The token's `video` grant is scoped
        to the single room `sutra:<room_id>` — there are no admin or
        wide grants. `role=host` requires the caller to be the room's
        host (403 `not_room_host` otherwise) and grants media publish;
        `role=viewer` is open to any authenticated user and grants
        subscribe + data channel only. Minting for an ended room is
        410 `live_room_ended`. Tokens expire after
        `LIVEKIT_TOKEN_TTL_MINUTES` (default 120); clients re-mint on
        expiry — there is no refresh grant.
      operationId: mintLiveToken
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_id, role]
              properties:
                room_id:
                  type: string
                  format: uuid
                  description: The live_rooms row id.
                role:
                  type: string
                  enum: [host, viewer]
                name:
                  type: string
                  description: Display hint for the SFU participant list.
      responses:
        '200':
          description: Token minted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveToken'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Bad JSON body or room_id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: role=host but the caller is not the room's host (not_room_host).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '404':
          description: No live room with that id (`live_room_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '410':
          description: The room has ended (`live_room_ended`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '422':
          description: Bad title/kind/role values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Live is disabled on this deployment (`live_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'

  /v1/live/rooms:
    post:
      tags: [live]
      summary: Open a live room
      description: |
        Creates a live_rooms row with the caller as host (status=live)
        and publishes `live:started` on the host's `user:<subject>`
        topic (best-effort; see docs/realtime-events.md). Clients then
        mint their tokens via POST /v1/live/token.
      operationId: createLiveRoom
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
                kind:
                  type: string
                  enum: [livestream, call]
                  default: livestream
      responses:
        '201':
          description: Room opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveRoom'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Bad JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Bad title or kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Live is disabled on this deployment (`live_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
    get:
      tags: [live]
      summary: List rooms on air
      description: |
        Newest-first shelf of `status=live` rooms. Pagination is
        `?limit=` (default 50, max 100) — the on-air feed is a shelf,
        not a scroll.
      operationId: listLiveRooms
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Rooms on air.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LiveRoom'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Live is disabled on this deployment (`live_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'

  /v1/live/rooms/{id}/end:
    post:
      tags: [live]
      summary: End a live room
      description: |
        Flips the room to `status=ended` (idempotent — ending an ended
        room succeeds) and publishes `live:ended` on the host's
        `user:<subject>` topic (best-effort). Only the host may end
        their room. The LiveKit webhook ingress (G1 part 2) reconciles
        against SFU truth for crashed hosts.
      operationId: endLiveRoom
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LiveRoomId'
      responses:
        '200':
          description: Room ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveRoom'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Room id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not the room's host (`not_room_host`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '404':
          description: No live room with that id (`live_room_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Live is disabled on this deployment (`live_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'

  /v1/feed/home:
    get:
      tags: [feed]
      summary: Get the caller's home timeline
      description: |
        The caller's home feed: posts by followed authors plus the
        caller's own posts, **ranked per page** by the v1 recommender
        (recency decay + follow-graph boost + like velocity — see
        docs/recsys.md; engagement can move an older post above a newer
        one). Hybrid fan-out / fan-in (see docs/feeds.md): normal authors are fanned out to Valkey
        timelines on write; authors with more than FANOUT_THRESHOLD
        followers (default 10,000) are merged in from PostgreSQL at read
        time. Keyset-paginated — pass `next_cursor` for the next page;
        null `next_cursor` means the last page. A downed timeline store
        is 503 `feed_unavailable` with Retry-After (infrastructure
        outage, not a client bug); author timelines and post CRUD are
        unaffected. `?translate=xx` (E4) translates item bodies
        best-effort into the requested language — see the parameter docs.
      operationId: getHomeFeed
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/TranslateTarget'
      responses:
        '200':
          description: One page of the home feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPage'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Bad limit, malformed cursor, or unsupported translate target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: Wrong method — this route only supports GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: GET
        '503':
          description: Timeline store unavailable — back off and retry.
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
                example: 5
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: feed_unavailable
                  message: home feed temporarily unavailable; please retry
                  request_id: 01J... (echoed)
