          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the developer (`not_owner`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such app (`mini_app_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/mini-apps/{id}/install:
    post:
      tags: [mini-apps]
      summary: Install a mini-app
      description: |
        Installs the app on the caller's shelf. Only **published** apps
        are installable. Idempotent: first install → 201, repeat → 200.
      operationId: installMiniApp
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Mini-app UUID.
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Installed.
          content:
            application/json:
              schema:
                type: object
                required: [installed, app_id]
                properties:
                  installed:
                    type: boolean
                    example: true
                  app_id:
                    type: string
                    format: uuid
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '200':
          description: Already installed (idempotent).
          content:
            application/json:
              schema:
                type: object
                required: [installed, app_id]
                properties:
                  installed:
                    type: boolean
                    example: true
                  app_id:
                    type: string
                    format: uuid
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such app (`mini_app_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Not installable (draft/suspended, `install_not_allowed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [mini-apps]
      summary: Uninstall a mini-app
      description: |
        Removes the app from the caller's shelf. Idempotent — 204
        whether or not the install existed.
      operationId: uninstallMiniApp
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Mini-app UUID.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Uninstalled.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/mini-apps/{id}/launch:
    post:
      tags: [mini-apps]
      summary: Launch a mini-app
      description: |
        The sandboxed frame's entry gate (empty body). Returns the
        registry row plus a short-lived (5-minute) HMAC launch token
        the client injects into the frame for attribution
        (docs/mini-apps.md). The owner may launch in any status
        (draft preview); other users need the install edge and the app
        must not be a draft. Fails closed with 503 `launch_unavailable`
        when MINIAPP_LAUNCH_SECRET is unset.
      operationId: launchMiniApp
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Mini-app UUID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Launch payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniAppLaunch'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cannot launch (`launch_not_allowed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such app (`mini_app_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Launch secret not configured (`launch_unavailable`, + `Retry-After`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

