              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed JSON body or unknown field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
