                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Creative not found (`creative_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/ads/creatives/{id}/activate:
    post:
      tags: [ads]
      summary: Activate a draft creative
      description: |
        Moves draft → active. The creative's campaign must not be
        archived. Activation does not imply serving — the part-3b
        serving path only reads active creatives on campaigns where
        Eligible() holds (active status, open window, remaining
        budget).
      operationId: activateAdCreative
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CreativeId'
      responses:
        '200':
          description: The activated creative.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdCreative'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Bad creative id (`invalid_creative_id`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a seller, or not the owner (`not_a_seller`, `not_owner`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Creative or campaign not found (`creative_not_found`, `campaign_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Transition not allowed (`invalid_status_transition`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: User UUID.
      schema:
        type: string
        format: uuid
        example: 3f6b1c9e-8b4a-4d2e-9f01-abc123def456
    PostId:
      name: id
      in: path
      required: true
      description: Post UUID.
      schema:
        type: string
        format: uuid
        example: 7e2a8f4c-1b3d-4e5f-8a09-b1c2d3e4f506
    MediaId:
      name: id
      in: path
      required: true
      description: Media UUID.
      schema:
        type: string
        format: uuid
        example: 9c1f7a4d-2e6b-4a3f-8c5d-e7f9a1b2c3d4
    LiveRoomId:
      name: id
      in: path
      required: true
      description: Live room UUID.
      schema:
        type: string
        format: uuid
        example: 5a8c1f2d-9b3e-4f6a-8c2d-1e5f7a9b3c4d
    PageLimit:
      name: limit
      in: query
      required: false
      description: |
        Page size, 1–100. Above 100 clamps to 100; non-positive or
        non-integer values are 400.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PageCursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor from the previous page's `next_cursor`. Malformed
        cursors are 400.
      schema:
        type: string
    SellerId:
      name: id
      in: path
      required: true
      description: Seller UUID.
      schema:
        type: string
        format: uuid
    ProductId:
      name: id
      in: path
      required: true
      description: Product UUID.
      schema:
        type: string
        format: uuid
    CampaignId:
      name: id
      in: path
      required: true
      description: Campaign UUID.
      schema:
        type: string
        format: uuid
    CreativeId:
      name: id
      in: path
      required: true
      description: Creative UUID.
      schema:
        type: string
        format: uuid
    VariantId:
      name: id
      in: path
      required: true
      description: Variant UUID.
      schema:
        type: string
        format: uuid
    OrderId:
      name: id
      in: path
      required: true
      description: Order UUID.
      schema:
        type: string
        format: uuid
    CommerceListLimit:
      name: limit
      in: query
      required: false
      description: |
        Commerce page size, 1–50. Out-of-range or non-integer values are 400.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    TranslateTarget:
      name: translate
      in: query
      required: false
      description: |
        E4 language bridge. When set, each item's body is translated
        best-effort into this language alongside the original
        (`translated_text` / `translated_from` appear on the item only
        when a translation actually happened). Translation is
        read-time decoration: a downed or slow translation backend
        degrades to the original text, never a feed failure. An
        unsupported value is 400 `invalid_translate_target`.
      schema:
        type: string
        enum: [hi, gu, ta, bn, te, kn, ml, mr, pa, or, as, ur, ne, en]

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256 JWT from the OIDC issuer (Hydra). Verified against the issuer's
        JWKS with a 15-minute cache and refresh-on-unknown-kid for rotation;
        alg is pinned to RS256 (alg:none/HS256 rejected); exp (60s leeway),
        iss and aud enforced. Default issuer http://hydra:4444, default
        audience sutra-api — see HYDRA_ISSUER / JWT_AUDIENCE env vars.
        AUTH_BYPASS=1 disables verification for local development (every
        request authenticates as AUTH_BYPASS_SUBJECT, default `dev-user`;
        loudly logged as insecure — never enable in production).

  schemas:
    LiveRoom:
      type: object
      required: [id, host_id, title, kind, status, viewer_cap, created_at, livekit_room_name]
      properties:
        id:
          type: string
          format: uuid
        host_id:
          type: string
          format: uuid
          description: The user id that opened the room.
        title:
          type: string
          maxLength: 120
        kind:
          type: string
          enum: [livestream, call]
        status:
          type: string
          enum: [live, ended]
        viewer_cap:
          type: integer
          description: Soft cap the client uses to show "room full" before joining.
        created_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        livekit_room_name:
          type: string
          description: |
            The SFU-side room identifier clients join: "sutra:<room_id>".
            Derived from the room id, never from the free-text title.
          example: "sutra:5a8c1f2d-9b3e-4f6a-8c2d-1e5f7a9b3c4d"
    LiveToken:
      type: object
      required: [token, ws_url, room_id, room_name, identity, role, expires_at, ttl_seconds]
      properties:
        token:
          type: string
          description: LiveKit participant JWT (HS256, signed with LIVEKIT_API_SECRET).
        ws_url:
          type: string
          description: Client-reachable LiveKit websocket URL.
          example: ws://localhost:7880
        room_id:
          type: string
          format: uuid
          description: The live_rooms row id.
        room_name:
          type: string
          description: The SFU room to join.
        identity:
          type: string
          description: The JWT sub — the caller's OIDC subject.
        role:
          type: string
          enum: [host, viewer]
        expires_at:
          type: string
          format: date-time
        ttl_seconds:
          type: integer
          description: Seconds until the token expires (re-mint on expiry).
    WebhookEndpoint:
      type: object
      required: [id, url]
      properties:
        id:
          type: string
          description: Endpoint id (ep_...).
          example: ep_2Z8xYzAbCdEfGh
        url:
          type: string
          format: uri
          description: Delivery target.
          example: https://your-app.example.com/sutra-webhooks
        description:
          type: string
          example: order notifications
        filterTypes:
          type: array
          items:
            type: string
          description: Event-type filter (Svix v1 field name); empty/absent receives everything.
          example: [order.created, order.status_changed]
        secret:
          type: string
          description: |
            Per-endpoint HMAC signing secret. Present ONLY in the 201
            create response — never on list, never again.
          example: whsec_EXAMPLE_DO_NOT_USE
    MiniApp:
      type: object
      required: [id, developer_id, name, slug, entry_url, manifest, version, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        developer_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
          example: Groceries
        slug:
          type: string
          pattern: '^[a-z0-9-]{3,40}$'
          description: Immutable first-come identifier.
          example: groceries
        description:
          type: string
          maxLength: 500
        icon_url:
          type: string
          format: uri
        entry_url:
          type: string
          format: uri
          description: Sandboxed frame entry point (http(s) only).
          example: https://groceries.example/app
        manifest:
          $ref: '#/components/schemas/MiniAppManifest'
        version:
          type: string
          example: 1.2.0
        status:
          type: string
          enum: [draft, published, suspended, archived]
          example: published
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MiniAppManifest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          description: Declared subset of the bridge allowlist (docs/mini-apps.md).
          items:
            type: string
            enum: [camera, microphone, geolocation, notifications, payments, storage, share, clipboard, vibration, biometric]
          example: [storage, payments]
      description: |
        Permission manifest. Unknown metadata keys are preserved
        verbatim but never interpreted by the platform.
    MiniAppRegister:
      type: object
      required: [name, slug, entry_url]
      properties:
        name:
          type: string
          maxLength: 80
          example: Groceries
        slug:
          type: string
          pattern: '^[a-z0-9-]{3,40}$'
          description: First-come, first-served; immutable after registration.
          example: groceries
        description:
          type: string
          maxLength: 500
        icon_url:
          type: string
          format: uri
        entry_url:
          type: string
          format: uri
          example: https://groceries.example/app
        manifest:
          $ref: '#/components/schemas/MiniAppManifest'
        version:
          type: string
          maxLength: 32
          example: 1.0.0
    MiniAppUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 500
          nullable: true
          description: Explicit null clears the description.
        icon_url:
          type: string
          format: uri
          nullable: true
          description: Explicit null clears the icon.
        entry_url:
          type: string
          format: uri
        manifest:
          $ref: '#/components/schemas/MiniAppManifest'
        version:
          type: string
          maxLength: 32
      description: Partial update; omit a field to leave it untouched.
    MiniAppDirectoryPage:
      type: object
      required: [apps]
      properties:
        apps:
          type: array
          items:
            $ref: '#/components/schemas/MiniApp'
        next_cursor:
          type: string
          description: Opaque keyset cursor; absent on the last page.
    MiniAppInstalled:
      type: object
      required: [app, installed_at]
      properties:
        app:
          $ref: '#/components/schemas/MiniApp'
        installed_at:
          type: string
          format: date-time
    MiniAppLaunch:
      type: object
      required: [app, launch_token, expires_at]
      properties:
        app:
          $ref: '#/components/schemas/MiniApp'
        launch_token:
          type: string
          description: |
            5-minute HMAC-SHA256 token binding (user_id, app_id) —
            v1.<base64url payload>.<base64url signature>. The client
            injects it into the frame's init data; the developer backend
            verifies attribution with the launch secret.
          example: v1.eyJ2IjoxLCJ1aWQiOiIuLi4iLCJhaWQiOiIuLi4iLCJleHAiOjE3NjA5MjIwMDB9.c2ln
        expires_at:
          type: string
          format: date-time
    AdTargeting:
      type: object
      description: |
        Audience filter. All arrays are inclusion lists (match ANY
        element); absent = no constraint on that axis. Unknown keys are
        rejected at write time (`invalid_targeting`) — a typo'd key
        would otherwise silently match everything.
      properties:
        countries:
          type: array
          items:
            type: string
            pattern: '^[a-z]{2}$'
          example: [in]
          description: ISO 3166-1 alpha-2 country codes (lowercase).
        languages:
          type: array
          items:
            type: string
            pattern: '^[a-z]{2}$'
          example: [hi, en]
          description: ISO 639-1 language codes (lowercase).
        categories:
          type: array
          items:
            type: string
          example: [mens-fashion]
          description: Category slugs from the catalog tree (must exist).
        devices:
          type: array
          items:
            type: string
            enum: [mobile, tablet, desktop]
      additionalProperties: false
    AdCampaign:
      type: object
      required: [id, advertiser_id, name, status, budget_paise, spend_paise, targeting, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        advertiser_id:
          type: string
          format: uuid
          description: The caller's seller row — never another advertiser's.
        name:
          type: string
          maxLength: 128
        status:
          type: string
          enum: [draft, active, paused, archived]
          description: |
            draft → active → paused → active → archived (terminal).
            Only active campaigns with an open window and remaining
            budget enter auctions.
        budget_paise:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000000
          description: Total budget in integer paise (₹1..₹10cr). Spend
            can never exceed it.
        spend_paise:
          type: integer
          format: int64
          minimum: 0
          description: |
            Accumulated billed spend. Read-only — never settable through
            this API (the billing path owns it).
        daily_budget_paise:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Optional daily cap; must not exceed budget_paise.
        targeting:
          $ref: '#/components/schemas/AdTargeting'
        start_at:
          type: string
          format: date-time
          nullable: true
        end_at:
          type: string
          format: date-time
          nullable: true
          description: Must be after start_at when both are set.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdCampaignReport:
      type: object
      required: [campaign_id, name, status, budget_paise, spend_paise, remaining_paise, eligible_now, days_live, delivery]
      properties:
        campaign_id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [draft, active, paused, archived]
        budget_paise:
          type: integer
          format: int64
          minimum: 1
        spend_paise:
          type: integer
          format: int64
          minimum: 0
          description: |
            Accumulated billed spend. Read-only — never settable through
            this API (the billing path owns it). Zero until the serving
            integration accrues per-impression GSP prices.
        remaining_paise:
          type: integer
          format: int64
          minimum: 0
          description: budget_paise − spend_paise, floored at 0. The auction's per-impression price must be ≤ this.
        daily_budget_paise:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        eligible_now:
          type: boolean
          description: Whether the campaign may enter auctions right now (status active + window open + budget remaining).
        eligibility_reason:
          type: string
          enum: [not_active, window_not_started, window_closed, budget_exhausted, archived]
          description: Set only when eligible_now is false — the blocking reason, in machine-stable form.
        days_live:
          type: number
          format: double
          minimum: 0
          description: Days since creation. The pacing denominator.
        spend_per_day_paise:
          type: number
          format: double
          description: |
            Average daily spend over the campaign's life. Null when there
            is no spend history to project from (fresh or zero-spend).
        projected_exhaustion_at:
          type: string
          format: date-time
          description: |
            Now + remaining_paise / spend_per_day_paise. Null when no
            projection is possible (no spend history or budget already
            exhausted).
        delivery:
          type: object
          required: [present]
          properties:
            present:
              type: boolean
              description: |
                False in v1 — delivery analytics (impressions, clicks,
                CTR) do not exist yet and are not faked. Lands with the
                serving integration (docs/ads.md).
    AdCampaignCreate:
      type: object
      required: [name, budget_paise]
      properties:
        name:
          type: string
          maxLength: 128
        budget_paise:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000000
        daily_budget_paise:
          type: integer
          format: int64
          minimum: 1
        targeting:
          $ref: '#/components/schemas/AdTargeting'
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
      additionalProperties: false
    AdCampaignPatch:
      type: object
      description: |
        Presence-flag partial update. `daily_budget_paise`, `start_at`
        and `end_at` accept explicit null to clear. `status` and
        `spend_paise` are not patchable (unknown-field rejection).
      properties:
        name:
          type: string
          maxLength: 128
        budget_paise:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000000
          description: Cannot be lowered below current spend_paise.
        daily_budget_paise:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        targeting:
          $ref: '#/components/schemas/AdTargeting'
        start_at:
          type: string
          format: date-time
          nullable: true
        end_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    AdCampaignPage:
      type: object
      required: [campaigns]
      properties:
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/AdCampaign'
        next_cursor:
          type: string
          description: Opaque keyset cursor; absent on the last page.
    AdCreative:
      type: object
      required: [id, campaign_id, name, kind, format, media_url, landing_url, headline, description, cta, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
          description: The owning campaign — always the caller's own.
        name:
          type: string
          maxLength: 128
        kind:
          type: string
          enum: [image, video, native]
        format:
          type: string
          enum: [image_1200x628, image_1080x1080, image_1080x1920, video_1920x1080, video_1080x1920, 'native']
          description: Exact served shape; must match the kind.
        media_url:
          type: string
          format: uri
          description: "The served asset. http(s) only — javascript:/data: URLs can never enter the registry."
        landing_url:
          type: string
          format: uri
          description: Click-through target. http(s) only.
        headline:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 140
        cta:
          type: string
          enum: ['', shop_now, learn_more, install, sign_up, watch_more]
        status:
          type: string
          enum: [draft, active, archived]
          description: |
            draft → active → archived (terminal). Only active
            creatives on Eligible() campaigns enter serving.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdCreativeCreate:
      type: object
      required: [name, kind, format, media_url, landing_url]
      properties:
        name:
          type: string
          maxLength: 128
        kind:
          type: string
          enum: [image, video, native]
        format:
          type: string
          description: Must be a valid format for the kind (e.g. image_1200x628 for image).
        media_url:
          type: string
          format: uri
        landing_url:
          type: string
          format: uri
        headline:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 140
        cta:
          type: string
          enum: ['', shop_now, learn_more, install, sign_up, watch_more]
    AdCreativePatch:
      type: object
      description: |
        Presence-flag partial update. status is never patchable;
        kind/format may only change on drafts, and must change
        together.
      properties:
        name:
          type: string
          maxLength: 128
        kind:
          type: string
          enum: [image, video, native]
        format:
          type: string
        media_url:
          type: string
          format: uri
        landing_url:
          type: string
          format: uri
        headline:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 140
        cta:
          type: string
          enum: ['', shop_now, learn_more, install, sign_up, watch_more]
    AdCreativePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdCreative'
        next_cursor:
          type: string
          description: Opaque keyset cursor; absent on the last page.
    WebhookEndpointCreate:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Delivery target; must be an http(s) URL with a host.
          example: https://your-app.example.com/sutra-webhooks
        description:
          type: string
          maxLength: 256
          example: order notifications
        filter_types:
          type: array
          items:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          description: Event-type filter; omit to receive everything.
          example: [order.created, order.status_changed]
        secret:
          type: string
          description: Bring-your-own signing secret; omit and Svix generates one.
    WebhookEventPublish:
      type: object
      required: [event_type, payload]
      properties:
        event_type:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          example: inventory.low
        payload:
          description: Any JSON value — the delivery body.
        event_id:
          type: string
          description: |
            Idempotency key. Omit and the API mints one; re-publishing the
            same event_id returns the original message.
          example: evt_2026_10_19_001
    WhatsAppSendResult:
      type: object
      required: [message_id]
      properties:
        message_id:
          type: string
          description: Provider message id (wamid.* on the Meta Cloud API).
          example: wamid.HBgN...
    WhatsAppSendRequest:
      type: object
      required: [to]
      additionalProperties: false
      properties:
        to:
          type: string
          description: E.164 recipient (+<8-15 digits>).
          example: +919876543210
        text:
          type: string
          maxLength: 4096
          description: Free-form text (Meta permits it inside the 24h service window).
          example: Your order #123 has shipped.
        template:
          type: object
          required: [name, language]
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 512
              example: order_update
            language:
              type: string
              enum: [en, hi, gu, ta, te, bn, kn, ml, mr]
              example: hi
            components:
              type: array
              items:
                type: object
                required: [type]
                additionalProperties: false
                properties:
                  type:
                    type: string
                    enum: [body, header, button]
                  parameters:
                    type: array
                    items:
                      type: string
                      maxLength: 1000
      description: |
        Exactly one of `text` or `template` is required.
    TallyVoucherResult:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          description: Bridge-agent job id (posting into Tally Prime is the agent's asynchronous job).
          example: job-42
    TallyVoucherRequest:
      type: object
      required: [kind, date, reference_no, lines]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [sales, journal]
          description: Tally voucher type.
          example: sales
        date:
          type: string
          pattern: ^[0-9]{8}$
          description: Voucher date, calendar-valid YYYYMMDD (Tally's XML date format).
          example: '20261020'
        reference_no:
          type: string
          maxLength: 128
          description: Our order id — the dedupe key at the bridge agent.
          example: ORD-2026-1042
        narration:
          type: string
          maxLength: 1000
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [ledger_name, amount_paise]
            additionalProperties: false
            properties:
              ledger_name:
                type: string
                maxLength: 128
                example: Cash
              amount_paise:
                type: integer
                description: Integer paise; positive = debit, negative = credit, non-zero, capped at ₹10 crore per line.
                example: 129900
      description: |
        Ledger lines must balance: debits and credits net to zero.
    ZohoContactResult:
      type: object
      required: [contact_id]
      properties:
        contact_id:
          type: string
          description: Zoho Books contact id.
          example: 460000000026049
    ZohoContactRequest:
      type: object
      required: [display_name]
      additionalProperties: false
      properties:
        display_name:
          type: string
          maxLength: 128
          description: Customer display name.
          example: A Sharma
        email:
          type: string
          maxLength: 256
          description: Optional contact email (sanity-checked; Zoho does the real validation).
          example: buyer@example.com
        phone:
          type: string
          description: Optional E.164 phone (+<8-15 digits>).
          example: +919876543210
    ZohoInvoiceResult:
      type: object
      required: [invoice_id]
      properties:
        invoice_id:
          type: string
          description: Zoho Books invoice id.
          example: 460000000026055
    ZohoInvoiceRequest:
      type: object
      required: [contact_id, reference_no, currency, due_date, lines]
      additionalProperties: false
      properties:
        contact_id:
          type: string
          maxLength: 64
          description: Zoho Books contact id the invoice is raised against.
          example: 460000000026049
        reference_no:
          type: string
          maxLength: 128
          description: Our order id — the dedupe key.
          example: ORD-2026-1042
        currency:
          type: string
          enum: [INR]
          description: Pinned to INR until the international launch.
          example: INR
        due_date:
          type: string
          pattern: ^[0-9]{8}$
          description: Invoice due date, calendar-valid YYYYMMDD.
          example: '20261027'
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [name, quantity, amount_paise]
            additionalProperties: false
            properties:
              name:
                type: string
                maxLength: 128
                example: Handloom Kurta
              quantity:
                type: integer
                minimum: 1
                maximum: 1000000
                example: 2
              amount_paise:
                type: integer
                description: Unit price in integer paise; positive only (an invoice line is a charge), capped at ₹10 crore per line.
                example: 129900
      description: |
        Charge-only lines: credit notes are a Wave 2 surface.
    WebhookMessage:
      type: object
      required: [id, event_type]
      properties:
        id:
          type: string
          description: Svix message id — use with GET /v1/webhooks/deliveries.
          example: msg_2Z8xYzAbCdEfGh
        event_type:
          type: string
          example: inventory.low
    WebhookAttempt:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          example: att_2Z8xYzAbCdEfGh
        status:
          type: string
          enum: [success, pending, fail, sending]
          description: Delivery status (Svix wire enum 0/1/2/3 mapped to its name).
        responseStatusCode:
          type: integer
          description: HTTP status your endpoint returned (0 when unreachable).
          example: 200
        timestamp:
          type: string
          format: date-time
    User:
      type: object
      required: [id, subject, display_name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Primary key (uuid via pgcrypto).
          example: 3f6b1c9e-8b4a-4d2e-9f01-abc123def456
        subject:
          type: string
          description: OIDC subject — the stable identity key, unique. Never exposed on public profile reads.
          example: 8f3a2b1c-4d5e-4f60-9a1b-2c3d4e5f6071
        display_name:
          type: [string, 'null']
          description: |
            Seeded from OIDC claims on first sight, never overwritten on
            later calls.
          example: Harshal Vanpariya
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Profile:
      type: object
      required: [user_id, handle, display_name, bio, avatar_url, followers_count, following_count, created_at, updated_at]
      properties:
        user_id:
          type: string
          format: uuid
          example: 3f6b1c9e-8b4a-4d2e-9f01-abc123def456
        handle:
          type: [string, 'null']
          description: |
            First-come unique handle, `[a-z0-9_]{3,20}`; null until claimed.
          example: dhanasvi
        display_name:
          type: [string, 'null']
          description: |
            Profile display name when set, otherwise the OIDC-seeded name
            from the identity record.
          example: Dhanasvi
        bio:
          type: [string, 'null']
          maxLength: 160
          example: Building Sutra.
        avatar_url:
          type: [string, 'null']
          description: Must be an http(s) URL when set.
          example: https://cdn.example/avatars/d.png
        followers_count:
          type: integer
          description: Computed live from the follow graph (not denormalized).
          example: 128
        following_count:
          type: integer
          example: 42
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProfilePatch:
      type: object
      description: |
        Partial profile update: only present keys change; present-but-null
        clears the field. Unknown keys are rejected.
      properties:
        handle:
          type: [string, 'null']
          description: Grammar `[a-z0-9_]{3,20}`; null clears the claim.
          example: dhanasvi
        display_name:
          type: [string, 'null']
          maxLength: 80
        bio:
          type: [string, 'null']
          maxLength: 160
        avatar_url:
          type: [string, 'null']
          description: Must be an http(s) URL when set.
      additionalProperties: false

    FollowItem:
      type: object
      required: [id, handle, display_name, avatar_url, followed_at]
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: [string, 'null']
        display_name:
          type: [string, 'null']
        avatar_url:
          type: [string, 'null']
        followed_at:
          type: string
          format: date-time
          description: When the edge was created (newest-first ordering key).

    FollowPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FollowItem'
        next_cursor:
          type: [string, 'null']
          description: |
            Opaque cursor for the next page; null on the last page.

    Post:
      type: object
      required: [id, author_id, text, media_ids, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          example: 7e2a8f4c-1b3d-4e5f-8a09-b1c2d3e4f506
        author_id:
          type: string
          format: uuid
          description: The author's user id.
          example: 3f6b1c9e-8b4a-4d2e-9f01-abc123def456
        text:
          type: string
          maxLength: 500
          description: Post body, max 500 runes (measured in runes, not bytes).
          example: Shipping the Wave 1 feed today.
        media_ids:
          type: array
          maxItems: 10
          description: |
            Media ids (max 10), grammar `[A-Za-z0-9_-]{1,128}`. Shape
            validated on create; readiness ("reference only ready media")
            is enforced by the media pipeline.
          items:
            type: string
          example: []
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PostCreate:
      type: object
      required: [text]
      description: |
        New post body. Unknown keys are rejected with 400 (strict API).
      properties:
        text:
          type: string
          maxLength: 500
          example: Shipping the Wave 1 feed today.
        media_ids:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,128}$'
          example: []
        auto_caption:
          type: boolean
          default: false
          description: |
            E3: request auto-captions for the post's video attachments.
            The caption worker transcribes ready videos and publishes
            VTT/SRT sidecars on the media row (caption_url). Best-effort
            and async — the 201 never waits for it.
      additionalProperties: false

    PostPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        next_cursor:
          type: [string, 'null']
          description: |
            Opaque cursor for the next page; null on the last page.

    LikeResult:
      type: object
      required: [liked, like_count]
      properties:
        liked:
          type: boolean
          description: Whether the caller currently likes the post.
        like_count:
          type: integer
          minimum: 0
          description: Current all-time like count of the post.

    FeedItem:
      allOf:
        - $ref: '#/components/schemas/Post'
        - type: object
          description: |
            A home-feed entry. `translated_text` / `translated_from`
            appear only when GET /v1/feed/home was called with
            ?translate= and the translation succeeded (best-effort).
          properties:
            translated_text:
              type: string
              description: The post body rendered in the requested target language.
            translated_from:
              type: string
              description: Detected source language (ISO 639-1) of the original text.

    FeedPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedItem'
        next_cursor:
          type: [string, 'null']
          description: |
            Opaque cursor for the next page; null on the last page.

    MediaUploadRequest:
      type: object
      required: [kind, filename, mime_type]
      properties:
        kind:
          type: string
          enum: [video, image]
          example: video
        filename:
          type: string
          description: 1–255 bytes, no path separators.
          example: clip.mp4
        mime_type:
          type: string
          description: Must start with the kind (e.g. video/mp4).
          example: video/mp4
      additionalProperties: false

    UploadSession:
      type: object
      required: [media_id, upload_url, method]
      properties:
        media_id:
          type: string
          format: uuid
          description: The minted media id; poll it via GET /v1/media/{id}.
        upload_url:
          type: string
          format: uri
          description: Direct SeaweedFS PUT URL for the bytes.
        method:
          type: string
          enum: [PUT]

    Rendition:
      type: object
      required: [name, url, bandwidth, width, height]
      properties:
        name:
          type: string
          example: 720p
        url:
          type: string
          format: uri
          description: HLS playlist URL.
        bandwidth:
          type: integer
          format: int64
          description: Bits per second.
        width:
          type: integer
        height:
          type: integer

    Media:
      type: object
      required: [id, owner_id, kind, status, caption_status, renditions, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [video, image]
        status:
          type: string
          enum: [pending, uploaded, ready, failed]
          description: |
            pending: upload URL minted, no bytes yet. uploaded: bytes
            confirmed, video awaiting the transcode worker. ready: safe
            to reference from posts. failed: worker gave up; see error.
        filename:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          format: int64
          description: Set when the upload completes (HEAD of the file).
        width:
          type: integer
          description: Set by the transcode worker (video) or client metadata.
        height:
          type: integer
        duration_ms:
          type: integer
          format: int64
          description: Video only; set by the transcode worker.
        poster_url:
          type: string
          format: uri
          description: Video poster frame (set when ready).
        renditions:
          type: array
          items:
            $ref: '#/components/schemas/Rendition'
        playback_url:
          type: string
          format: uri
          description: |
            The original upload URL; for videos, prefer the master
            playlist once ready.
        error:
          type: string
          description: Failure reason when status is failed.
        auto_caption:
          type: boolean
          description: |
            Sticky opt-in (E3): true once captions were requested for
            this video (upload intent or POST /v1/posts auto_caption).
        caption_status:
          type: string
          enum: [none, requested, processing, ready, failed]
          description: |
            Caption worker lifecycle. none: never requested. requested:
            enqueued, awaiting the worker. processing: worker holds the
            job. ready: sidecars published, caption_url live. failed:
            worker gave up (reason is internal-only).
        caption_url:
          type: string
          format: uri
          description: |
            VTT sidecar of the transcription (caption_status=ready).
            Web players load VTT natively; an SRT twin sits alongside.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Seller:
      type: object
      required: [id, store_name, store_slug, status, commission_rate_bps, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        store_name:
          type: string
          example: Shivam Electronics
        store_slug:
          type: string
          description: First-come store handle, unique, `[a-z0-9-]{3,30}`.
          example: shivam-electronics
        status:
          type: string
          enum: [active, suspended]
        commission_rate_bps:
          type: integer
          description: Basis points; 0 = the 0%-commission marketplace model.
          example: 0
        gstin:
          type: string
          description: Present only when the seller supplied one.
          example: 24ABCDE1234F1Z5
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SellerCreate:
      type: object
      required: [store_name]
      additionalProperties: false
      properties:
        store_name:
          type: string
          minLength: 1
          description: 3–80 runes (rune-counted, not bytes).
        store_slug:
          type: string
          description: |
            Optional; derived from the store name when omitted. Lowercased
            server-side.
        gstin:
          type: string
          description: |
            Optional; validated as a 15-character GSTIN and uppercased
            server-side.
    CategoryNode:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: audio
        name:
          type: string
          example: Audio
        parent_id:
          type: string
          format: uuid
          description: Absent on root categories.
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
    CategoryTree:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          description: Root categories with nested children.
          items:
            $ref: '#/components/schemas/CategoryNode'
    Product:
      type: object
      required: [id, seller_id, title, description, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
          description: Absent when the product is uncategorized.
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, active, archived]
          description: |
            New listings start as draft — invisible on the storefront until
            activated. archived: owner archive (never hard-deleted).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductCreate:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
        description:
          type: string
        category_slug:
          type: string
          description: Must exist in the curated tree (`category_not_found` otherwise).
        status:
          type: string
          enum: [draft, active, archived]
          description: Defaults to draft when omitted.
    ProductPatch:
      type: object
      additionalProperties: false
      description: |
        Partial edit; explicit null on any field means "leave unchanged"
        (except category_slug, where "" clears the category).
      properties:
        title:
          type: string
        description:
          type: string
        category_slug:
          type: string
          description: Empty string clears the category.
        status:
          type: string
          enum: [draft, active, archived]
    ProductPage:
      type: object
      required: [products]
      properties:
        products:
          type: array
          description: Newest first, keyset-paged on (created_at, id).
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: string
          description: |
            Product id of the last returned item; pass as `cursor` for the
            next page. Null when this is the last page.
    Variant:
      type: object
      required: [id, product_id, sku, price_paise, attributes, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        sku:
          type: string
          description: Unique per product.
        price_paise:
          type: integer
          format: int64
          description: Integer paise — money is never a float.
          example: 149900
        mrp_paise:
          type: integer
          format: int64
          description: Absent when no MRP; always ≥ price_paise when set.
        attributes:
          type: object
          additionalProperties:
            type: string
          description: String→string bag (color, size, …).
          example: {color: black}
        status:
          type: string
          enum: [active, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VariantCreate:
      type: object
      required: [sku, price_paise]
      additionalProperties: false
      properties:
        sku:
          type: string
        price_paise:
          type: integer
          format: int64
          description: Integer paise.
        mrp_paise:
          type: integer
          format: int64
          description: Null/omitted means no MRP.
          nullable: true
        attributes:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
          enum: [active, archived]
          description: Defaults to active when omitted.
    VariantPatch:
      type: object
      additionalProperties: false
      description: |
        Partial edit; explicit null on a field means "leave unchanged",
        EXCEPT mrp_paise, where explicit null clears the MRP.
      properties:
        sku:
          type: string
        price_paise:
          type: integer
          format: int64
        mrp_paise:
          type: integer
          format: int64
          description: Explicit null clears the MRP.
          nullable: true
        attributes:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
          enum: [active, archived]
    Inventory:
      type: object
      required: [variant_id, quantity, reserved, available, updated_at]
      properties:
        variant_id:
          type: string
          format: uuid
        quantity:
          type: integer
          description: Total units on hand.
        reserved:
          type: integer
          description: |
            Units held by in-flight orders; owned by the F6 order saga,
            never touched by the adjust endpoint.
        available:
          type: integer
          description: quantity − reserved (what buyers may buy).
        updated_at:
          type: string
          format: date-time
    InventoryAdjust:
      type: object
      required: [delta]
      additionalProperties: false
      properties:
        delta:
          type: integer
          description: |
            Signed stock movement (may be negative). One atomic UPDATE;
            409 `insufficient_stock` when it would drive quantity below
            zero.
          example: 100

    CartLine:
      type: object
      required: [variant_id, product_id, seller_id, title, sku, price_paise, quantity, line_total_paise, added_at]
      description: |
        One cart line: the variant reference plus live product data.
        `price_paise` is read fresh at view time — never a stale
        snapshot.
      properties:
        variant_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        title:
          type: string
        sku:
          type: string
        price_paise:
          type: integer
          description: Live price in integer paise.
          example: 149900
        mrp_paise:
          type: integer
          nullable: true
          description: Live MRP in integer paise; null when not set.
        quantity:
          type: integer
          minimum: 1
          maximum: 999
        line_total_paise:
          type: integer
          description: quantity × live price_paise.
        added_at:
          type: string
          format: date-time

    Cart:
      type: object
      required: [items, item_count, subtotal_paise, unavailable_count]
      description: |
        The full cart view: buyable lines plus totals.
        `unavailable_count` is the number of lines whose variant or
        parent product is no longer active — reported, not deleted.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        item_count:
          type: integer
          description: Number of buyable lines.
        subtotal_paise:
          type: integer
          description: Sum of line_total_paise over buyable lines only.
        unavailable_count:
          type: integer
          description: Lines excluded from totals (archived/inactive).

    CartItemAdd:
      type: object
      required: [variant_id, quantity]
      additionalProperties: false
      properties:
        variant_id:
          type: string
          format: uuid
          description: The variant to add.
        quantity:
          type: integer
          minimum: 1
          maximum: 999
          description: Units to add (accumulates with the existing line).

    CartQuantityPatch:
      type: object
      required: [quantity]
      additionalProperties: false
      properties:
        quantity:
          type: integer
          minimum: 0
          maximum: 999
          description: |
            New line quantity. `0` removes the line (204, same as
            DELETE).

    OrderItem:
      type: object
      required: [variant_id, product_id, sku, title, price_paise, quantity, line_total_paise]
      description: |
        One order line: an IMMUTABLE price snapshot taken at checkout.
        A later seller price change never rewrites order history; the
        RESTRICT references keep orders as legal history.
      properties:
        variant_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        title:
          type: string
          description: Snapshot of the product title at checkout.
        price_paise:
          type: integer
          description: Checkout-time price in integer paise.
          example: 149900
        mrp_paise:
          type: integer
          nullable: true
          description: Checkout-time MRP; null when not set.
        quantity:
          type: integer
          minimum: 1
        line_total_paise:
          type: integer
          description: quantity × checkout-time price_paise.

    Order:
      type: object
      required: [id, buyer_id, seller_id, status, payment_method, total_paise, items, created_at, updated_at]
      description: |
        A Wave-3 order. `payment_method` is always `cod` until F4 adds
        prepaid; `total_paise` is the sum of the line snapshots.
      properties:
        id:
          type: string
          format: uuid
        buyer_id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [created, confirmed, shipped, delivered, cancelled, returned]
          description: |
            Lifecycle: created → confirmed → shipped → delivered (seller);
            created/cancelled and delivered/returned as documented.
        payment_method:
          type: string
          enum: [cod]
          description: Wave-3 is COD-first; F4 adds prepaid methods.
        total_paise:
          type: integer
          description: Sum of line_total_paise over the snapshot lines.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderSummary:
      type: object
      required: [id, buyer_id, seller_id, status, payment_method, total_paise, line_count, created_at]
      description: The list view of an order (lines are on the detail endpoint).
      properties:
        id:
          type: string
          format: uuid
        buyer_id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [created, confirmed, shipped, delivered, cancelled, returned]
        payment_method:
          type: string
          enum: [cod]
        total_paise:
          type: integer
        line_count:
          type: integer
          description: Number of lines in the order.
        created_at:
          type: string
          format: date-time

    OrderList:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          description: Order summaries, newest first.
          items:
            $ref: '#/components/schemas/OrderSummary'

    CheckoutRequest:
      type: object
      additionalProperties: false
      description: |
        Checkout takes no parameters — the request body must be absent
        or an empty object. Unknown fields are 400 `unknown_field`.

    CheckoutResult:
      type: object
      required: [orders]
      description: |
        One order per seller (a mixed cart splits). The cart is empty
        after a successful checkout.
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'

    OrderStatusPatch:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [created, confirmed, shipped, delivered, cancelled, returned]
          description: |
            Target status. Only the edges in the description of
            PATCH /v1/orders/{id}/status are legal for the caller's
            role; anything else is 422 `invalid_transition`.

    SearchProductHit:
      type: object
      required: [id, title, description, seller_id, status, updated_at_unix, sort_seq]
      description: |
        One Meilisearch `products` index document (F2). The search view
        of a product: cheapest active variant's price as `min_price_paise`
        (the storefront's "from ₹X" badge), numeric `sort_seq` as the
        keyset tie-breaker.
      properties:
        id:
          type: string
          format: uuid
          description: Product id (index primary key).
        title:
          type: string
          description: Searchable; outranks description.
        description:
          type: string
          description: Searchable.
        seller_id:
          type: string
          format: uuid
        category_slug:
          type: string
          description: From the category tree; absent when uncategorized.
          example: audio
        status:
          type: string
          enum: [active, draft, archived]
        min_price_paise:
          type: integer
          description: |
            Cheapest ACTIVE variant's price (integer paise); absent when
            no active variants exist.
          example: 149900
        updated_at_unix:
          type: integer
          description: Product `updated_at` as unix seconds — sort key.
        sort_seq:
          type: integer
          description: |
            `products.search_seq` identity value — numeric tie-breaker
            for keyset paging (Meilisearch range filters are
            numbers-only).
    SearchPage:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          description: Ordered `updated_at_unix desc, sort_seq desc` (relevance first within equal order).
          items:
            $ref: '#/components/schemas/SearchProductHit'
        next_cursor:
          type: string
          description: |
            Opaque base64url cursor over the last hit's
            `(updated_at_unix, sort_seq)`; pass as `cursor` for the
            next page. Absent on the last page.

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable code, derived from the status:
                bad_request (400), unauthorized (401), forbidden (403),
                not_found (404), method_not_allowed (405), conflict (409),
                unprocessable_entity (422), rate_limited (429),
                internal (500), service_unavailable (503); `error` for any
                other status. Codes are part of the contract — never rename.
              example: not_found
            message:
              type: string
              description: Human-readable detail (no stack traces, no driver text).
              example: not found
            request_id:
              type: string
              description: Echoes X-Request-ID for log correlation.
              example: 01J9X0ABCD...
    AguiMessage:
      type: object
      description: One message in an AG-UI run input (E1 subset).
      properties:
        role:
          type: string
          example: user
        content:
          type: string
          example: hello
    RunAgentInput:
      type: object
      description: |
        AG-UI RunAgentInput (E1 subset): thread/run identity, the message
        list, and an opaque state bag the client owns. thread_id/run_id
        default to server-minted values when omitted.
      properties:
        thread_id:
          type: string
          example: thread-a1b2c3d4e5f6
        run_id:
          type: string
          example: run-0f9e8d7c6b5a
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AguiMessage'
        state:
          type: object
          description: Opaque client-owned state bag, echoed back untouched.
    ChatInput:
      type: object
      description: |
        E2 personal-AI chat input. thread_id is the client's conversation
        key (scoped to the user); omit it to start a new thread — the
        minted id comes back in RUN_STARTED's threadId. Only the last
        user message is answered; memory comes from the thread.
      properties:
        thread_id:
          type: string
          maxLength: 128
          example: thread-a1b2c3d4e5f6
        messages:
          type: array
          description: Message history tail for this turn (max 8000 chars per message).
          items:
            $ref: '#/components/schemas/AguiMessage'
    AguiEvent:
      type: object
      description: |
        One AG-UI 1.0 BaseEvent carried in an SSE `data:` frame
        (`data: {"type":"RUN_STARTED",...}\n\n`). The `type` field selects
        the rest: RUN_STARTED (threadId, runId), STEP_STARTED/STEP_FINISHED
        (stepName), TEXT_MESSAGE_START (messageId, role),
        TEXT_MESSAGE_CONTENT (messageId, delta), TEXT_MESSAGE_END
        (messageId), RUN_FINISHED (threadId, runId),
        RUN_ERROR (message).
      properties:
        type:
          type: string
          example: TEXT_MESSAGE_CONTENT
      additionalProperties: true
    BusinessInput:
      type: object
      description: |
        H1 business-copilot input (catalog Q&A + order insights for the
        caller's own seller store). thread_id is the client's conversation
        key (scoped to the user); omit it to start a new thread. Turns are
        stamped with the business_v1 prompt version; the served reply is
        grounding-verified (GroundingGuard) before streaming.
      properties:
        thread_id:
          type: string
          maxLength: 128
          example: thread-a1b2c3d4e5f6
        messages:
          type: array
          description: Message history tail for this turn (max 8000 chars per message).
          items:
            $ref: '#/components/schemas/AguiMessage'

  headers:
    XRequestID:
      description: |
        Request ID — client-supplied values are echoed, otherwise generated
        server-side. Present on every response, including errors and
        recovered panics.
      schema:
        type: string

  responses:
    Unauthorized:
      description: |
        Missing, malformed, expired, or wrong-signature bearer token.
        (Under AUTH_BYPASS=1 this path is disabled — all requests
        authenticate as the bypass subject.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: unauthorized
              message: unauthorized
              request_id: 01J9X0ABCD...
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'

    RateLimited:
      description: |
        Per-IP rate budget exhausted. Slow down and retry after the
        Retry-After delay. Commerce endpoints (sellers, products, variants,
        categories, search, cart, orders) have an additional tighter budget
        on top of the global one (F6; COMMERCE_LIMIT_RPS/COMMERCE_LIMIT_BURST):
        commerce-budget rejections carry code `commerce_rate_limited` instead
        of `rate_limited`, still 429 with Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: rate_limited
              message: too many requests; slow down and retry
              request_id: 01J9X0ABCD...
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          description: Seconds to wait before retrying (ceiling of the wait, at least 1).
          schema:
            type: integer
            example: 3
        X-RateLimit-Limit:
          description: Configured sustained requests/sec for this client IP.
          schema:
            type: integer
            example: 100

    InternalError:
      description: |
        Unexpected server failure. The message is generic by design —
        details go to the server log keyed by request_id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: internal
              message: internal server error
              request_id: 01J9X0ABCD...
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'

    NotFound:
      description: |
        Unknown path (also the catch-all for unknown /v1/* routes).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: not_found
              message: not found
              request_id: 01J9X0ABCD...
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
