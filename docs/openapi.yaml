            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '404':
          description: No such variant (`variant_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/variants/{id}/inventory:
    get:
      tags: [commerce]
      summary: Get a variant's stock record
      description: |
        The public stock record (buyers see availability). `available` is
        quantity minus reserved; the F6 order saga owns `reserved`.
      operationId: getInventory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VariantId'
      responses:
        '200':
          description: The stock record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed variant id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such variant (`variant_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/variants/{id}/inventory/adjust:
    post:
      tags: [commerce]
      summary: Adjust inventory (signed stock movement)
      description: |
        Owner-only. `delta` may be negative (e.g. a warehouse recount); the
        write is one atomic UPDATE and 409 `insufficient_stock` when the
        delta would drive quantity below zero. `reserved` is never touched
        here — the F6 order saga owns it.
      operationId: adjustInventory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VariantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryAdjust'
            example:
              delta: 100
      responses:
        '200':
          description: The stock record after the adjustment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed JSON body or unknown field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No seller account (`seller_not_registered`) or not the owner (`not_owner`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '404':
          description: No such variant (`variant_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '409':
          description: Delta would drive stock below zero (`insufficient_stock`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/search:
    get:
      tags: [commerce]
      summary: Product search (storefront)
      description: |
        The read half of F2 (Wave-3 product search), a dependency-aware
        proxy over self-hosted Meilisearch CE. Queries are ranked by
        Meilisearch's default rules on `q` (title outranks description,
        typo tolerance on); results within equal relevance come newest
        first (`updated_at desc, sort_seq desc` — `sort_seq` is the
        numeric keyset tie-breaker because Meilisearch range filters
        work on numbers only; see `docs/search.md`).
        Paging is a true keyset: pass the previous page's `next_cursor`
        as `cursor`; stop when `next_cursor` is absent. `status`
        defaults to `active` — a defense-in-depth second gate, since
        drafts/archived listings already leave the index on write.
        Indexing is async: a just-activated product may take a moment
        to appear (poll in integration tests). Search being down is a
        dependency outage, never a bug: expect 503
        `search_unavailable` + `Retry-After`, not 500.
      operationId: searchProducts
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Full-text query over title + description (≤ 200 chars). Empty = newest-first browse order.
          schema:
            type: string
            maxLength: 200
        - name: seller_id
          in: query
          required: false
          description: Filter to one seller's storefront.
          schema:
            type: string
            format: uuid
        - name: category_slug
          in: query
          required: false
          description: Filter to one category, e.g. `audio`.
          schema:
            type: string
            pattern: '^[a-z0-9-]{1,64}$'
        - name: status
          in: query
          required: false
          description: Document status gate; defaults to `active`.
          schema:
            type: string
            enum: [active, draft, archived]
            default: active
        - name: min_price_paise
          in: query
          required: false
          description: Price band over the document's `min_price_paise` (cheapest active variant). Non-negative integer.
          schema:
            type: integer
            minimum: 0
        - name: max_price_paise
          in: query
          required: false
          description: Upper bound of the price band; must be ≥ min_price_paise.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Page size, 1–50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from the previous page's `next_cursor`. Malformed cursors are 400.
          schema:
            type: string
      responses:
        '200':
          description: One page of search hits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: |
            Malformed param (`invalid_query`, `invalid_seller_id`,
            `invalid_category_slug`, `invalid_status`, `invalid_min_price`,
            `invalid_max_price`, `invalid_price_range`, `invalid_limit`,
            `invalid_cursor`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: |
            Search unavailable — disabled (no master key) or the
            Meilisearch cluster is down. Retry after the `Retry-After`
            window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/cart:
    get:
      tags: [commerce]
      summary: View my cart
      description: |
        The buyer's cart: buyable lines with LIVE prices (read fresh at
        view time — the line price may differ from when the item was
        added), plus `subtotal_paise` over the buyable lines only.
        Lines whose variant or parent product left `active` status are
        not deleted — they are excluded from the totals and reported in
        `unavailable_count` (archiving a product never silently drops a
        buyer's line; reactivating restores it).
      operationId: getCart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The cart view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [commerce]
      summary: Clear my cart
      description: |
        Removes every line (204, idempotent). Checkout also clears the
        cart on success.
      operationId: clearCart
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Cart cleared.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/cart/items:
    post:
      tags: [commerce]
      summary: Add an item to the cart
      description: |
        Accumulating upsert: adding a variant already in the cart grows
        the line. The stock check is transaction-atomic against
        `available` (quantity − reserved) — overflow rolls the whole
        write back with 409 `insufficient_stock`. Only `active`
        variants of `active` products are buyable (422
        `variant_not_available`); quantity is 1–999 (422
        `invalid_quantity`).
      operationId: addCartItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemAdd'
            example:
              variant_id: 9c1f7a4d-2e6b-4a3f-8c5d-e7f9a1b2c3d4
              quantity: 2
      responses:
        '201':
          description: The cart line after the add
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartLine'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: |
            Malformed JSON, unknown field, missing `variant_id`/`quantity`
            (`missing_field`), non-UUID variant (`invalid_variant_id`),
            or non-integer quantity (`invalid_quantity`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such variant (`variant_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '409':
          description: Resulting line quantity exceeds available stock (`insufficient_stock`); nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '422':
          description: |
            Out-of-range quantity (`invalid_quantity`) or variant/product
            not active (`variant_not_available`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/cart/items/{variant_id}:
    patch:
      tags: [commerce]
      summary: Set a cart line's quantity
      description: |
        `quantity: 0` removes the line (204, same as DELETE).
        Overflow against available stock rolls back with 409
        `insufficient_stock`; the cart is never left half-written.
      operationId: setCartItemQuantity
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VariantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartQuantityPatch'
            example:
              quantity: 3
      responses:
        '200':
          description: The cart line after the quantity change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartLine'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '204':
          description: quantity was 0 — the line was removed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: |
            Malformed variant id in the path, malformed JSON, unknown
            field, missing or non-integer `quantity`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            The variant id names no variant (`variant_not_found`), or the
            cart holds no such line (`cart_item_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '409':
          description: New quantity exceeds available stock (`insufficient_stock`); line unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '422':
          description: |
            Out-of-range quantity (`invalid_quantity`) or variant/product
            not active (`variant_not_available`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [commerce]
      summary: Remove a cart line
      description: |
        Idempotent by design — deleting an absent line is a 204 no-op,
        so a lost acknowledgement can be retried safely.
      operationId: removeCartItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VariantId'
      responses:
        '204':
          description: Line removed (or was already absent).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed variant id in the path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/orders:
    post:
      tags: [commerce]
      summary: Checkout — turn the cart into orders
      description: |
        Wave-3 is COD-first: `payment_method` is always `cod` and no
        payment step is involved (the F4 Cashfree adapter will add
        prepaid later; the adapter stays fail-closed until real
        onboarding is done, post-investors). Checkout is one
        transaction: live buyable lines are re-read, each line's stock
        is re-verified under a row lock and reserved, prices are
        snapshotted into `order_items` at checkout-time values (a later
        seller price change never rewrites history), then the cart is
        cleared. A mixed cart becomes one order PER SELLER, so the
        response is a list. Empty cart → 422 `cart_empty`; a line that
        overshoots stock after re-verify → 409 `insufficient_stock`
        with the cart left intact and nothing reserved.
      operationId: checkoutCart
      security:
        - bearerAuth: []
      requestBody:
        required: false
        description: |
          Checkout takes no parameters. An absent body is normal; a
          present body must be an empty JSON object (unknown fields
          400).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: One order per seller, all `created`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResult'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed JSON or unknown field in the body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            A line overshoots stock after the re-verify
            (`insufficient_stock`); cart intact, nothing reserved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '422':
          description: |
            Empty cart (`cart_empty`) or a line's variant/product no
            longer buyable (`variant_not_available`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [commerce]
      summary: List my orders
      description: |
        Buyer view by default (`role=buyer`); `role=seller` lists orders
        placed against the caller's storefront (callers without a seller
        account see an empty list, never an error). Strangers can never
        see an order — detail and transitions are buyer-or-seller only.
      operationId: listOrders
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          required: false
          description: Which side of the order to list; defaults to buyer.
          schema:
            type: string
            enum: [buyer, seller]
            default: buyer
        - name: limit
          in: query
          required: false
          description: |
            Page size, 1–50. Non-integers are 400; out-of-range values
            clamp to the sane default (20) rather than failing.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          required: false
          description: Offset into the result set (newest first).
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: The order summaries, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: |
            Unknown `role` (`invalid_role`), or non-integer
            `limit`/`offset` (`invalid_limit`, `invalid_offset`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/orders/{id}:
    get:
      tags: [commerce]
      summary: Get an order
      description: |
        Full order view — lines with their immutable price snapshots —
        for the buyer or the seller only. Strangers get 403 `forbidden`.
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed order id (`invalid_order_id`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is neither the buyer nor the seller (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '404':
          description: No such order (`order_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/orders/{id}/status:
    patch:
      tags: [commerce]
      summary: Move an order along its state machine
      description: |
        Role-aware transitions under a row lock — a buyer cannot
        confirm, a seller cannot mark delivered, and no one can move a
        terminal order: `created → confirmed → shipped → delivered` by
        the seller; `created → cancelled` by buyer or seller;
        `confirmed → cancelled` by the seller; `delivered → returned`
        by buyer or seller. Cancel/return RELEASES the stock
        reservation back to available; delivery CONVERTS it into a
        sale. A caller who is both buyer and the seller's user
        (self-purchase) acts with the seller's edges. Unknown status
        names → 422 `invalid_status`; legal names
        on illegal edges → 422 `invalid_transition`.
      operationId: transitionOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusPatch'
            example:
              status: confirmed
      responses:
        '200':
          description: The order after the transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: |
            Malformed order id (`invalid_order_id`), malformed JSON,
            unknown field (`unknown_field`), missing `status`
            (`missing_field`), or non-string status (`invalid_status`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is neither the buyer nor the seller (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '404':
          description: No such order (`order_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '422':
          description: |
            Unknown status name (`invalid_status`) or the
            (from, to, role) edge does not exist (`invalid_transition`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/webhooks/endpoints:
    get:
      tags: [webhooks]
      summary: List my webhook endpoints
      description: |
        Returns the delivery targets registered on the caller's own
        `user:<id>` Svix app. Secrets are never returned here — Svix
        shows each endpoint's signing secret exactly once, at creation.
      operationId: listWebhookEndpoints
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Endpoint list.
          content:
            application/json:
              schema:
                type: object
                required: [endpoints]
                properties:
                  endpoints:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookEndpoint'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: Svix server unreachable (`webhooks_upstream`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Webhooks not enabled on this deployment (`webhooks_unavailable`, + `Retry-After`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [webhooks]
      summary: Register a webhook endpoint
      description: |
        Registers a delivery target (your HTTPS URL) on the caller's own
        Svix app. The 201 response carries the endpoint's signing secret —
        the one and only time it is shown. Save it now; rotate by deleting
        and recreating the endpoint.
      operationId: createWebhookEndpoint
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointCreate'
      responses:
        '201':
          description: Endpoint registered (includes the one-time secret).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed JSON or unknown fields (`invalid_request_body`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Bad URL (`invalid_endpoint_url`), bad filter type (`invalid_event_type`), or Svix-side validation (`webhooks_invalid`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: Svix server unreachable (`webhooks_upstream`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/webhooks/endpoints/{id}:
    delete:
      tags: [webhooks]
      summary: Delete a webhook endpoint
      description: |
        Removes a delivery target from the caller's Svix app. Idempotent —
        deleting an already-gone endpoint is still 204.
      operationId: deleteWebhookEndpoint
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Endpoint id (from the create/list responses).
      responses:
        '204':
          description: Endpoint deleted (or already gone).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Missing endpoint id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such endpoint (`webhook_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: Svix server unreachable (`webhooks_upstream`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/webhooks/events:
    post:
      tags: [webhooks]
      summary: Publish a custom event
      description: |
        Publishes a developer-defined event to the caller's own Svix app;
        every registered endpoint receives a signed delivery. 202 — delivery
        is async; poll GET /v1/webhooks/deliveries for the attempt log.
        `event_id` is the idempotency key: re-publishing the same event_id
        returns the ORIGINAL message instead of double-delivering.
      operationId: publishWebhookEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEventPublish'
      responses:
        '202':
          description: Event accepted for delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookMessage'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed JSON or unknown fields (`invalid_request_body`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Bad event type (`invalid_event_type`) or missing payload (`event_payload_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: Svix server unreachable (`webhooks_upstream`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/webhooks/deliveries:
    get:
      tags: [webhooks]
      summary: Delivery attempt log
      description: |
        Svix's per-message delivery-attempt log — the proof of delivery.
        Attempt statuses are the Svix integer enum (0/1/2/3) surfaced as
        their names (`success`, `pending`, `fail`, `sending`).
      operationId: getWebhookDeliveries
      security:
        - bearerAuth: []
      parameters:
        - name: message_id
          in: query
          required: true
          schema:
            type: string
          description: Message id from the publish response.
      responses:
        '200':
          description: Attempt log.
          content:
            application/json:
              schema:
                type: object
                required: [message_id, attempts]
                properties:
                  message_id:
                    type: string
                  attempts:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookAttempt'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Missing message_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such message (`webhook_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: Svix server unreachable (`webhooks_upstream`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/integrations/whatsapp/send:
    post:
      tags: [integrations]
      summary: Send a WhatsApp message (seller-scoped)
      description: |
        Sends a text or approved-template WhatsApp message to one E.164
        recipient via the Meta Cloud API (direct, no BSP). Seller-scoped:
        the caller must own a seller account (`not_a_seller` otherwise).
        Exactly one of `text` or `template` is required.

        Until the post-investors Meta onboarding completes, the seam is a
        fail-closed stub and every send answers 503 `whatsapp_unavailable`
        with Retry-After — the API never implies a message went out.
      operationId: sendWhatsApp
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppSendRequest'
      responses:
        '202':
          description: Message accepted by the gateway.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppSendResult'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Bad grammar — neither/both of text/template, unknown fields, template violations (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller owns no seller account (`not_a_seller`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          description: Bad recipient phone (`invalid_phone`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: The WhatsApp gateway failed to accept the message (`whatsapp_upstream`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: WhatsApp is not wired on this deployment (`whatsapp_unavailable`); Retry-After present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
  /v1/integrations/tally/vouchers:
    post:
      tags: [integrations]
      summary: Post a Tally voucher (seller-scoped, per-seller bridge)
      description: |
        Posts a sales or journal voucher to the seller's own on-premise
        Tally bridge agent. The bridge is resolved PER SELLER from the
        `seller_tally_bridges` registry (migration 0016) — never from a
        global config — so one seller's agent can never see another
        seller's vouchers. Amounts are integer paise (positive = debit,
        negative = credit) and the lines must balance to zero; `date`
        is a calendar-valid YYYYMMDD.

        Until the post-investors bridge-agent deployment, every post
        fails closed: no bridge registered → 503 `tally_not_registered`;
        registered but no real provider wired → 503 `tally_unavailable`.
        Retry-After is present on both — the API never implies a voucher
        was posted.
      operationId: postTallyVoucher
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TallyVoucherRequest'
      responses:
        '202':
          description: Voucher accepted by the seller's bridge agent (bridge job id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TallyVoucherResult'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Bad voucher grammar — bad kind/date, empty reference_no, empty/unbalanced/duplicate lines, over-cap amounts (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller owns no seller account (`not_a_seller`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: The seller's bridge agent failed to accept the voucher (`tally_upstream`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: No bridge registered for this seller (`tally_not_registered`) or Tally posting is not wired on this deployment (`tally_unavailable`); Retry-After present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
  /v1/integrations/zoho/contacts:
    post:
      tags: [integrations]
