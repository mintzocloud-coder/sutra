    get:
      tags: [mini-apps]
      summary: My installed mini-apps
      description: |
        The caller's installed shelf, newest install first, with the
        full rows the client needs to boot each frame (`entry_url` +
        `manifest`). Suspended apps are included (they keep working);
        archived apps are excluded.
