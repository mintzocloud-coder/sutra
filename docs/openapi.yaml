# Sutra API — OpenAPI 3.1 spec (services/api, Go)
#
# GENERATED BY HAND, not from code annotations: keep this file in sync with
# services/api/cmd/api/main.go and the internal/middleware + internal/users
# packages on every route change. CI validates this file on every push.
openapi: 3.1.0
info:
  title: Sutra API
  version: 1.0.0
  description: |
    Core REST API of the Sutra backend (Go service). Realtime messaging
    lives in the Elixir chat service (Phoenix channels, not REST); this
    spec covers the HTTP surface of services/api only.

    Conventions that apply to every endpoint:
    * Every response carries an `X-Request-ID` header (generated server-side
      when the client does not send one, echoed back when it does).
    * Every non-2xx response uses the JSON error envelope
      `{"error": {"code", "message", "request_id"}}`; machine-readable
      `code` values are stable and part of the contract (never rename).
    * Baseline security headers on all responses: X-Content-Type-Options:
      nosniff, X-Frame-Options: DENY, Referrer-Policy:
      strict-origin-when-cross-origin, Content-Security-Policy:
      `default-src 'none'; frame-ancestors 'none'`.
    * Rate limiting is per client IP (token bucket; RATE_LIMIT_RPS default
      100, RATE_LIMIT_BURST default 200). Non-preflight responses carry
      `X-RateLimit-Limit`; 429 responses add `Retry-After` (seconds) and use
      the error envelope with code `rate_limited`.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: http://localhost:8081
    description: Local docker-compose API (container port 8080, host 8081)
  - url: https://api.botsteam.example
    description: Production (placeholder — set the real host when deployed)
tags:
  - name: system
    description: Liveness / readiness probes (unauthenticated, DB-free for /healthz)
  - name: identity
    description: Authenticated caller identity
  - name: commerce
    description: |
      Wave-3 marketplace: seller onboarding, curated categories, product
      catalog (products, purchasable variants, inventory). Write routes are
      owner-only — the caller must have a seller account and own the
      resource; reads are public storefront reads. Money is always integer
      paise (`price_paise`, `mrp_paise`); the platform commission is 0%
      (`commission_rate_bps` default 0).
  - name: mini-apps
    description: |
      Wave-4 mini-app runtime: developer registry, published-only
      directory, status transitions, per-user installs, and the launch
      gate that mints the short-lived HMAC token for the sandboxed
      frame (docs/mini-apps.md).
  - name: ads
    description: |
      Wave-5 ads platform (H3): the advertiser API — campaigns, budgets
      and targeting over the deterministic GSP auction kernel
      (internal/ads). Seller-scoped: the advertiser is the caller's
      seller row, so non-sellers get `not_a_seller` and advertisers can
      never see each other's campaigns. Money is integer paise. Spend is
      never settable through this API (the billing path owns it).
paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      description: |
        Returns 200 while the process is alive. Never depends on the
        database, so orchestrators can distinguish a dead process from a
        process that merely lost its DB.
      operationId: healthz
      security: []
      responses:
        '200':
          description: Process alive
          content:
            text/plain:
              schema:
                type: string
                example: ok
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/ai/healthz:
    get:
      tags: [ai]
      summary: AI service liveness (proxied)
      description: |
        Proxied to the Python AI service's own /healthz (the /v1/ai prefix
        is stripped by the Go proxy). Requires the caller's JWT (same as
        every /v1/* route); the proxy adds the internal service Bearer
        token and forwards the verified subject as X-Sutra-Subject.
        With AI_SERVICE_TOKEN empty the proxy answers 503
        (service_unavailable); with the AI service down it answers 503 +
        Retry-After. All /v1/ai/* routes (healthz, ag-ui/run, chat,
        translate) are documented in this spec; the contract is in
        docs/ai-core.md.
      operationId: aiHealthz
      security:
        - bearerAuth: []
      responses:
        '200':
          description: AI service alive (proxied payload)
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: sutra-ai
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: AI service not configured or unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/ai/translate:
    post:
      tags: [ai]
      summary: Translate text (IndicTrans2, proxied)
      description: |
        Proxied to the Python AI service's /translate (the /v1/ai prefix is
        stripped by the Go proxy). Requires the caller's JWT; the proxy adds
        the internal service Bearer token and forwards the verified subject
        as X-Sutra-Subject. Translates post/comment-sized text between en
        and Indic languages (hi, gu, ta, bn, te, kn, ml, mr, pa, or, as,
        ur, ne) via AI4Bharat IndicTrans2 checkpoints (MIT). Results are
        cached in Valkey by (content-hash, target) for 30 days — `cached`
        tells you whether this response came from cache. `source: "auto"`
        resolves via Unicode script detection (ASCII -> en, Devanagari ->
        hi, ...); pass an explicit ISO code when detection fails. Per-user
        rate limit (TRANSLATE_RPM, default 30/min) -> 429
        `translate_rate_limited` with Retry-After. With AI_SERVICE_TOKEN
        empty or the AI service down the proxy answers 503
        (service_unavailable); a missing IndicTrans2 runtime answers 503
        `translate_unavailable` (fail-closed, never a silent stub).
        Contract: docs/language-bridge.md.
      operationId: aiTranslate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Text to translate (max 4000 chars)
                  example: Hello, how are you?
                source:
                  type: string
                  description: ISO 639-1 source code, or "auto"
                  default: auto
                  example: auto
                target:
                  type: string
                  description: ISO 639-1 target code
                  default: en
                  example: hi
      responses:
        '200':
          description: Translation result
          content:
            application/json:
              schema:
                type: object
                required: [text, source, target, cached, model]
                properties:
                  text:
                    type: string
                    example: नमस्ते, आप कैसे हैं?
                  source:
                    type: string
                    description: Resolved ISO 639-1 source code
                    example: en
                  target:
                    type: string
                    example: hi
                  cached:
                    type: boolean
                    description: True when served from the Valkey cache
                  model:
                    type: string
                    description: Backend that produced the text
                    example: indictrans2
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Invalid input (empty_text, text_too_long, invalid_language)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: AI service not configured/unreachable, or the IndicTrans2 runtime is not installed (translate_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/ai/ag-ui/run:
    post:
      tags: [ai]
      summary: AG-UI agent run (echo skeleton, proxied, SSE)
      description: |
        Proxied to the Python AI service's /ag-ui/run (the /v1/ai prefix is
        stripped by the Go proxy). Requires the caller's JWT; the proxy adds
        the internal service Bearer <redacted> and forwards the verified subject
        as X-Sutra-Subject. Accepts a RunAgentInput, streams AG-UI 1.0
        BaseEvents as SSE over the echo graph:
        RUN_STARTED -> STEP_STARTED(echo) -> STEP_FINISHED(echo) ->
        TEXT_MESSAGE_START -> TEXT_MESSAGE_CONTENT -> TEXT_MESSAGE_END ->
        RUN_FINISHED (graph failure mid-stream becomes RUN_ERROR).
        Abuse guards (E6): X-Sutra-Subject is required (401 without it);
        per-user fixed-window rate limit (AI_AGUI_RPM, default 60/min) ->
        429 `ai_rate_limited` with Retry-After. No token budget applies —
        the echo turn spends zero model tokens.
        Contract: docs/ai-core.md.
      operationId: aiAgUiRun
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunAgentInput'
      responses:
        '200':
          description: SSE stream of AG-UI BaseEvents
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AguiEvent'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Per-user AG-UI rate limit exceeded (ai_rate_limited) or the Go API per-IP limiter fired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Retry-After:
              type: integer
              description: Seconds until the next fixed window
        '503':
          description: AI service not configured or unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/ai/chat:
    post:
      tags: [ai]
      summary: Personal AI chat (proxied, SSE)
      description: |
        Proxied to the Python AI service's /chat (the /v1/ai prefix is
        stripped by the Go proxy). Requires the caller's JWT; the proxy adds
        the internal service Bearer <redacted> and forwards the verified subject
        as X-Sutra-Subject. One LangGraph turn (recall -> generate ->
        persist) with PG-backed per-user conversation memory keyed by
        thread_id, the versioned system prompt (AI_PROMPT_VERSION, never
        hardcoded), and per-delta streaming via LangGraph custom stream
        mode. Event sequence: RUN_STARTED (carries the minted threadId when
        omitted) -> STEP_STARTED(recall) -> STEP_FINISHED -> STEP_STARTED
        (generate) -> TEXT_MESSAGE_START -> TEXT_MESSAGE_CONTENT* ->
        TEXT_MESSAGE_END -> STEP_FINISHED -> STEP_STARTED(persist) ->
        STEP_FINISHED -> RUN_FINISHED (failures become RUN_ERROR).
        Guards run EAGERLY before streaming, so rejections are JSON 429s
        (never truncated streams): per-user fixed-window rate limit
        (AI_CHAT_RPM, default 20/min) -> `ai_rate_limited`, and daily
        token budget (AI_DAILY_TOKEN_BUDGET, default 50000/day) ->
        `ai_budget_exhausted`, both with Retry-After.
        With AI_SERVICE_TOKEN empty or the AI service down the proxy
        answers 503 (service_unavailable).
        Contract: docs/ai-core.md.
      operationId: aiChat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatInput'
      responses:
        '200':
          description: SSE stream of AG-UI BaseEvents for the chat turn
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AguiEvent'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Invalid input (empty_messages, message_too_long)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Per-user chat rate limit (ai_rate_limited) or daily token budget exhausted (ai_budget_exhausted); the Go API per-IP limiter shares this envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Retry-After:
              type: integer
              description: Seconds until the next window / UTC midnight
        '503':
          description: AI service not configured or unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/ai/business:
    post:
      tags: [ai]
      summary: Business copilot for sellers (proxied, SSE)
      description: |
        Proxied to the Python AI service's /business (the /v1/ai prefix is
        stripped by the Go proxy). Requires the caller's JWT; the proxy adds
        the internal service Bearer <redacted> and forwards the verified subject
        as X-Sutra-Subject. One LangGraph turn (recall -> retrieve ->
        generate -> persist): retrieve runs read-only (BEGIN READ ONLY)
        catalog Q&A (the seller's own active products/variants, keyword
        search) and/or order insights (trailing-30d status counts, delivered
        revenue, top products) per the turn's intent; generate buffers the
        model reply and GroundingGuard verifies every stated price
        (paise-normalized) and SKU against the injected facts BEFORE the
        first streamed frame — a fabricated attribute becomes the safe
        fallback, never the wire. Event sequence mirrors /v1/ai/chat
        (retrieve adds its own STEP pair). Non-sellers get 403
        not_a_seller eagerly, before any store data is touched. Guards
        run EAGERLY (JSON, never truncated streams): per-user rate limit
        (AI_BIZ_RPM, default 20/min) -> `ai_rate_limited`, and the daily
        token budget (AI_DAILY_TOKEN_BUDGET, SHARED pool with /v1/ai/chat)
        -> `ai_budget_exhausted`, both with Retry-After.
        Contract: docs/business-ai.md.
      operationId: aiBusiness
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessInput'
      responses:
        '200':
          description: SSE stream of AG-UI BaseEvents for the business turn (reply is grounding-verified before streaming)
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AguiEvent'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller has no seller store (not_a_seller)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Invalid input (empty_messages, message_too_long)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Per-user business rate limit (ai_rate_limited) or daily token budget exhausted (ai_budget_exhausted); the Go API per-IP limiter shares this envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Retry-After:
              type: integer
              description: Seconds until the next window / UTC midnight
        '503':
          description: AI service not configured or unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /readyz:
    get:
      tags: [system]
      summary: Readiness probe
      description: |
        Returns 200 when the API can serve traffic (currently: the
        PostgreSQL pool answers a ping). Returns 503 with the error envelope
        when the database is unreachable so the orchestrator stops routing
        traffic until it recovers.
      operationId: readyz
      security: []
      responses:
        '200':
          description: Ready to serve
          content:
            text/plain:
              schema:
                type: string
                example: ok
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: service_unavailable
                  message: "not ready: database unreachable"
                  request_id: 01J9X0ABCD...
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'

  /v1/me:
    get:
      tags: [identity]
      summary: Get caller identity
      description: |
        Returns the identity record for the authenticated caller. The row is
        provisioned just-in-time on first sight (INSERT ... ON CONFLICT is
        race-safe), so a valid token never 404s here — it gets its own
        record. `display_name` is seeded from the OIDC `name` /
        `preferred_username` claims on first sight and never overwritten;
        the public handle lives on the profile (PATCH /v1/me/profile),
        not on this record.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Caller identity record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: |
            Wrong method — this route only supports GET. The `Allow` header
            names the supported methods.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: method_not_allowed
                  message: method not allowed
                  request_id: 01J9X0ABCD...
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: GET
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/me/profile:
    patch:
      tags: [social]
      summary: Update caller profile
      description: |
        Partial update of the caller's public profile; the profiles row is
        created on first use (lazy — reads of users without a profile fall
        back to the identity record). Only the keys present in the body
        change; a present-but-null key clears that field. Unknown keys are
        rejected with 400 (strict API). Handle claims are first-come:
        grammar `[a-z0-9_]{3,20}`; a taken handle is 409 `handle_taken`.
      operationId: patchMyProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
            example:
              handle: dhanasvi
              display_name: Dhanasvi
              bio: Building Sutra.
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed JSON body or unknown field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: Wrong method — this route only supports PATCH.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: PATCH
        '409':
          description: |
            Handle already claimed by another user (error code "handle_taken").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: handle_taken
                  message: handle is already taken
                  request_id: 01J9X0ABCD...
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '422':
          description: |
            Validation failure — `invalid_handle` (grammar), `field_too_long`,
            or `invalid_avatar_url` (must be http(s)).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/users/{id}:
    get:
      tags: [social]
      summary: Get public profile
      description: |
        Public profile for any user. Users without a profiles row still
        resolve (handle null, display name falls back to the OIDC seed).
        The OIDC subject is never exposed here — the handle is the public
        identifier. Follower/following counts are computed live.
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed user id (not a UUID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: invalid_user_id
                  message: user id must be a UUID
                  request_id: 01J9X0ABCD...
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such user (error code "user_not_found").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/users/{id}/follow:
    post:
      tags: [social]
      summary: Follow a user
      description: |
        Creates the follow edge caller → user. Idempotent: the first call
        is 201, repeats are 200 — retries never error. Following yourself
        is 422 `cannot_follow_self`; an unknown user is 404. A rolling
        per-user velocity cap applies (default 200 new follows/hour,
        `FOLLOW_VELOCITY_PER_HOUR`): over the cap is 429
        `follow_velocity_limited` with a Retry-After header telling the
        client when the oldest follow in the window ages out.
      operationId: followUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Already following (idempotent retry)
          content:
            application/json:
              schema:
                type: object
                required: [following, user_id]
                properties:
                  following:
                    type: boolean
                    example: true
                  user_id:
                    type: string
                    format: uuid
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '201':
          description: Follow edge created
          content:
            application/json:
              schema:
                type: object
                required: [following, user_id]
                properties:
                  following:
                    type: boolean
                    example: true
                  user_id:
                    type: string
                    format: uuid
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed user id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '405':
          description: Wrong method — this route supports POST and DELETE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: POST, DELETE
        '422':
          description: Cannot follow yourself (error code "cannot_follow_self").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [social]
      summary: Unfollow a user
      description: |
        Removes the follow edge caller → user. Idempotent: 204 whether or
        not the edge existed.
      operationId: unfollowUser
