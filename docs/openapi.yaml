# Sutra API — OpenAPI 3.1 spec (services/api, Go)
#
# GENERATED BY HAND, not from code annotations: keep this file in sync with
# services/api/cmd/api/main.go and the internal/middleware + internal/users
# packages on every route change. CI validates this file on every push.
openapi: 3.1.0
info:
  title: Sutra API
  version: 1.0.0
  description: |
    Core REST API of the Sutra backend (Go service). Realtime messaging
    lives in the Elixir chat service (Phoenix channels, not REST); this
    spec covers the HTTP surface of services/api only.

    Conventions that apply to every endpoint:
    * Every response carries an `X-Request-ID` header (generated server-side
      when the client does not send one, echoed back when it does).
    * Every non-2xx response uses the JSON error envelope
      `{"error": {"code", "message", "request_id"}}`; machine-readable
      `code` values are stable and part of the contract (never rename).
    * Baseline security headers on all responses: X-Content-Type-Options:
      nosniff, X-Frame-Options: DENY, Referrer-Policy:
      strict-origin-when-cross-origin, Content-Security-Policy:
      `default-src 'none'; frame-ancestors 'none'`.
    * Rate limiting is per client IP (token bucket; RATE_LIMIT_RPS default
      100, RATE_LIMIT_BURST default 200). Non-preflight responses carry
      `X-RateLimit-Limit`; 429 responses add `Retry-After` (seconds) and use
      the error envelope with code `rate_limited`.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: http://localhost:8081
    description: Local docker-compose API (container port 8080, host 8081)
  - url: https://api.botsteam.example
    description: Production (placeholder — set the real host when deployed)
tags:
  - name: system
    description: Liveness / readiness probes (unauthenticated, DB-free for /healthz)
  - name: identity
    description: Authenticated caller identity
paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      description: |
        Returns 200 while the process is alive. Never depends on the
        database, so orchestrators can distinguish a dead process from a
        process that merely lost its DB.
      operationId: healthz
      security: []
      responses:
        '200':
          description: Process alive
          content:
            text/plain:
              schema:
                type: string
                example: ok
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/ai/healthz:
    get:
      tags: [ai]
      summary: AI service liveness (proxied)
      description: |
        Proxied to the Python AI service's own /healthz (the /v1/ai prefix
        is stripped by the Go proxy). Requires the caller's JWT (same as
        every /v1/* route); the proxy adds the internal service Bearer
        token and forwards the verified subject as X-Sutra-Subject.
        With AI_SERVICE_TOKEN empty the proxy answers 503
        (service_unavailable); with the AI service down it answers 503 +
        Retry-After. Full /v1/ai/* coverage (chat, translate, ...) lands
        in E6 — see docs/ai-core.md for the roadmap.
      operationId: aiHealthz
      security:
        - bearerAuth: []
      responses:
        '200':
          description: AI service alive (proxied payload)
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: sutra-ai
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: AI service not configured or unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /readyz:
    get:
      tags: [system]
      summary: Readiness probe
      description: |
        Returns 200 when the API can serve traffic (currently: the
        PostgreSQL pool answers a ping). Returns 503 with the error envelope
        when the database is unreachable so the orchestrator stops routing
        traffic until it recovers.
      operationId: readyz
      security: []
      responses:
        '200':
          description: Ready to serve
          content:
            text/plain:
              schema:
                type: string
                example: ok
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: service_unavailable
                  message: "not ready: database unreachable"
                  request_id: 01J9X0ABCD...
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'

  /v1/me:
    get:
      tags: [identity]
      summary: Get caller identity
      description: |
        Returns the identity record for the authenticated caller. The row is
        provisioned just-in-time on first sight (INSERT ... ON CONFLICT is
        race-safe), so a valid token never 404s here — it gets its own
        record. `display_name` is seeded from the OIDC `name` /
        `preferred_username` claims on first sight and never overwritten;
        the public handle lives on the profile (PATCH /v1/me/profile),
        not on this record.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Caller identity record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: |
            Wrong method — this route only supports GET. The `Allow` header
            names the supported methods.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: method_not_allowed
                  message: method not allowed
                  request_id: 01J9X0ABCD...
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: GET
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/me/profile:
    patch:
      tags: [social]
      summary: Update caller profile
      description: |
        Partial update of the caller's public profile; the profiles row is
        created on first use (lazy — reads of users without a profile fall
        back to the identity record). Only the keys present in the body
        change; a present-but-null key clears that field. Unknown keys are
        rejected with 400 (strict API). Handle claims are first-come:
        grammar `[a-z0-9_]{3,20}`; a taken handle is 409 `handle_taken`.
      operationId: patchMyProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
            example:
              handle: dhanasvi
              display_name: Dhanasvi
              bio: Building Sutra.
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed JSON body or unknown field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: Wrong method — this route only supports PATCH.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: PATCH
        '409':
          description: |
            Handle already claimed by another user (error code "handle_taken").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: handle_taken
                  message: handle is already taken
                  request_id: 01J9X0ABCD...
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '422':
          description: |
            Validation failure — `invalid_handle` (grammar), `field_too_long`,
            or `invalid_avatar_url` (must be http(s)).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/users/{id}:
    get:
      tags: [social]
      summary: Get public profile
      description: |
        Public profile for any user. Users without a profiles row still
        resolve (handle null, display name falls back to the OIDC seed).
        The OIDC subject is never exposed here — the handle is the public
        identifier. Follower/following counts are computed live.
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed user id (not a UUID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: invalid_user_id
                  message: user id must be a UUID
                  request_id: 01J9X0ABCD...
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such user (error code "user_not_found").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/users/{id}/follow:
    post:
      tags: [social]
      summary: Follow a user
      description: |
        Creates the follow edge caller → user. Idempotent: the first call
        is 201, repeats are 200 — retries never error. Following yourself
        is 422 `cannot_follow_self`; an unknown user is 404. A rolling
        per-user velocity cap applies (default 200 new follows/hour,
        `FOLLOW_VELOCITY_PER_HOUR`): over the cap is 429
        `follow_velocity_limited` with a Retry-After header telling the
        client when the oldest follow in the window ages out.
      operationId: followUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Already following (idempotent retry)
          content:
            application/json:
              schema:
                type: object
                required: [following, user_id]
                properties:
                  following:
                    type: boolean
                    example: true
                  user_id:
                    type: string
                    format: uuid
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '201':
          description: Follow edge created
          content:
            application/json:
              schema:
                type: object
                required: [following, user_id]
                properties:
                  following:
                    type: boolean
                    example: true
                  user_id:
                    type: string
                    format: uuid
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed user id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '405':
          description: Wrong method — this route supports POST and DELETE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: POST, DELETE
        '422':
          description: Cannot follow yourself (error code "cannot_follow_self").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [social]
      summary: Unfollow a user
      description: |
        Removes the follow edge caller → user. Idempotent: 204 whether or
        not the edge existed.
      operationId: unfollowUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Edge removed (or never existed)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed user id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '405':
          description: Wrong method — this route supports POST and DELETE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: POST, DELETE
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/users/{id}/followers:
    get:
      tags: [social]
      summary: List followers
      description: |
        Users following this user, newest first. Keyset-paginated on
        (created_at, edge id) — pass `next_cursor` for the next page; null
        `next_cursor` means the last page. No OFFSET, so pages stay stable
        as the graph grows.
      operationId: listFollowers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: One page of followers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowPage'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed user id, bad limit, or bad cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/users/{id}/following:
    get:
      tags: [social]
      summary: List following
      description: |
        Users this user follows, newest first. Same keyset pagination as
        /followers.
      operationId: listFollowing
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: One page of followed users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowPage'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed user id, bad limit, or bad cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/posts:
    post:
      tags: [posts]
      summary: Publish a post
      description: |
        Publishes a post as the caller. Body text is capped at 500 runes
        (measured in runes, not bytes, so emoji-heavy posts are measured
        fairly); blank bodies are 422. media_ids are validated for shape
        (`[A-Za-z0-9_-]{1,128}`, max 10 per post) — the readiness gate
        ("reference only ready media") is enforced by the media pipeline
        (D4), not here. A per-author rolling velocity cap applies (default
        30 posts/hour, `POST_VELOCITY_PER_HOUR`): over the cap is 429
        `post_velocity_limited` with a Retry-After header telling the
        client when the oldest post in the window ages out.
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreate'
            example:
              text: Shipping the Wave 1 feed today.
              media_ids: []
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed JSON body or unknown field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: Wrong method — this route only supports POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: POST
        '422':
          description: |
            Validation failure — `empty_post` (blank body), `post_too_long`
            (>500 runes), `too_many_media` (>10), or `invalid_media_id`
            (grammar).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          description: |
            Over the per-author velocity cap (error code
            "post_velocity_limited"); the Retry-After header carries the
            wait in seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Retry-After:
              description: Seconds until the oldest post in the rolling window ages out
              schema:
                type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/posts/{id}:
    delete:
      tags: [posts]
      summary: Delete a post
      description: |
        Deletes a post. Author-only: 403 `post_not_author` when the caller
        is not the author; 404 `post_not_found` for unknown ids (deleting
        an already-gone post is a client bug worth surfacing, unlike the
        idempotent unfollow).
      operationId: deletePost
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '204':
          description: Post deleted
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed post id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the post's author.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '404':
          description: No such post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '405':
          description: Wrong method — this route only supports DELETE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: DELETE
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/media/upload:
    post:
      tags: [media]
      summary: Start a media upload
      description: |
        Mints a media row and returns a direct SeaweedFS PUT URL
        ("presigned" here means pre-assigned: no signature or expiry —
        security comes from unguessable fids, the status lifecycle, and
        the network boundary). Bytes go straight to SeaweedFS and never
        through the API. The row starts `pending`; the client PUTs its
        file, then calls `/v1/media/{id}/complete`. Storage-master
        outages are 503 `media_unavailable` with Retry-After.
      operationId: createMediaUpload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadRequest'
            example:
              kind: video
              filename: clip.mp4
              mime_type: video/mp4
      responses:
        '201':
          description: Upload session minted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed JSON body or unknown field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: |
            `invalid_media_kind` (kind not video/image),
            `invalid_mime_type` (mime must start with the kind, e.g.
            video/mp4), `invalid_filename` (1–255 bytes, no path
            separators).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: |
            `media_unavailable` — the storage master is unreachable.
            Retriable; carries Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'

  /v1/media/{id}:
    get:
      tags: [media]
      summary: Get one media record
      description: |
        Returns the media row, including lifecycle status. Clients poll
        this while a video transcodes (status `uploaded` → `ready` or
        `failed`). Media ids are unguessable UUIDs and rows carry no
        PII, so any authenticated user may read.
      operationId: getMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: The media record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Media id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No media with that id (`media_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/media/{id}/complete:
    post:
      tags: [media]
      summary: Mark an upload complete
      description: |
        Called after the client PUT its bytes to the upload URL. The
        API HEADs the file on SeaweedFS to confirm bytes landed (size
        > 0): images go straight to `ready`; videos go to `uploaded`
        and are enqueued for the transcode worker (D4 part 2). Re-
        completing a finished upload is 409 `upload_already_completed`;
        completing someone else's upload is 403 `media_not_owned`.
      operationId: completeMediaUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Media advanced to its next status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Media id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The media belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '404':
          description: No media with that id (`media_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '409':
          description: Upload already completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '422':
          description: |
            `upload_bytes_missing` — no bytes found at the upload URL;
            PUT the file first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/feed/home:
    get:
      tags: [feed]
      summary: Get the caller's home timeline
      description: |
        The caller's home feed: posts by followed authors plus the
        caller's own posts, newest first. Hybrid fan-out / fan-in
        (see docs/feeds.md): normal authors are fanned out to Valkey
        timelines on write; authors with more than FANOUT_THRESHOLD
        followers (default 10,000) are merged in from PostgreSQL at read
        time. Keyset-paginated — pass `next_cursor` for the next page;
        null `next_cursor` means the last page. A downed timeline store
        is 503 `feed_unavailable` with Retry-After (infrastructure
        outage, not a client bug); author timelines and post CRUD are
        unaffected.
      operationId: getHomeFeed
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: One page of the home feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPage'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Bad limit or malformed cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: Wrong method — this route only supports GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: GET
        '503':
          description: Timeline store unavailable — back off and retry.
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
                example: 5
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: feed_unavailable
                  message: home feed temporarily unavailable; please retry
                  request_id: 01J... (echoed)
  /v1/users/{id}/posts:
    get:
      tags: [posts]
      summary: List a user's posts
      description: |
        One author's posts, newest first. Keyset-paginated on
        (created_at, id) — pass `next_cursor` for the next page; null
        `next_cursor` means the last page. No OFFSET, so pages stay stable
        while the author keeps posting.
      operationId: listUserPosts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: One page of the author's posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPage'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed user id, bad limit, or bad cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '405':
          description: Wrong method — this route only supports GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: GET
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: User UUID.
      schema:
        type: string
        format: uuid
        example: 3f6b1c9e-8b4a-4d2e-9f01-abc123def456
    PostId:
      name: id
      in: path
      required: true
      description: Post UUID.
      schema:
        type: string
        format: uuid
        example: 7e2a8f4c-1b3d-4e5f-8a09-b1c2d3e4f506
    MediaId:
      name: id
      in: path
      required: true
      description: Media UUID.
      schema:
        type: string
        format: uuid
        example: 9c1f7a4d-2e6b-4a3f-8c5d-e7f9a1b2c3d4
    PageLimit:
      name: limit
      in: query
      required: false
      description: |
        Page size, 1–100. Above 100 clamps to 100; non-positive or
        non-integer values are 400.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PageCursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor from the previous page's `next_cursor`. Malformed
        cursors are 400.
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256 JWT from the OIDC issuer (Hydra). Verified against the issuer's
        JWKS with a 15-minute cache and refresh-on-unknown-kid for rotation;
        alg is pinned to RS256 (alg:none/HS256 rejected); exp (60s leeway),
        iss and aud enforced. Default issuer http://hydra:4444, default
        audience sutra-api — see HYDRA_ISSUER / JWT_AUDIENCE env vars.
        AUTH_BYPASS=1 disables verification for local development (every
        request authenticates as AUTH_BYPASS_SUBJECT, default `dev-user`;
        loudly logged as insecure — never enable in production).

  schemas:
    User:
      type: object
      required: [id, subject, display_name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Primary key (uuid via pgcrypto).
          example: 3f6b1c9e-8b4a-4d2e-9f01-abc123def456
        subject:
          type: string
          description: OIDC subject — the stable identity key, unique. Never exposed on public profile reads.
          example: 8f3a2b1c-4d5e-4f60-9a1b-2c3d4e5f6071
        display_name:
          type: [string, 'null']
          description: |
            Seeded from OIDC claims on first sight, never overwritten on
            later calls.
          example: Harshal Vanpariya
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Profile:
      type: object
      required: [user_id, handle, display_name, bio, avatar_url, followers_count, following_count, created_at, updated_at]
      properties:
        user_id:
          type: string
          format: uuid
          example: 3f6b1c9e-8b4a-4d2e-9f01-abc123def456
        handle:
          type: [string, 'null']
          description: |
            First-come unique handle, `[a-z0-9_]{3,20}`; null until claimed.
          example: dhanasvi
        display_name:
          type: [string, 'null']
          description: |
            Profile display name when set, otherwise the OIDC-seeded name
            from the identity record.
          example: Dhanasvi
        bio:
          type: [string, 'null']
          maxLength: 160
          example: Building Sutra.
        avatar_url:
          type: [string, 'null']
          description: Must be an http(s) URL when set.
          example: https://cdn.example/avatars/d.png
        followers_count:
          type: integer
          description: Computed live from the follow graph (not denormalized).
          example: 128
        following_count:
          type: integer
          example: 42
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProfilePatch:
      type: object
      description: |
        Partial profile update: only present keys change; present-but-null
        clears the field. Unknown keys are rejected.
      properties:
        handle:
          type: [string, 'null']
          description: Grammar `[a-z0-9_]{3,20}`; null clears the claim.
          example: dhanasvi
        display_name:
          type: [string, 'null']
          maxLength: 80
        bio:
          type: [string, 'null']
          maxLength: 160
        avatar_url:
          type: [string, 'null']
          description: Must be an http(s) URL when set.
      additionalProperties: false

    FollowItem:
      type: object
      required: [id, handle, display_name, avatar_url, followed_at]
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: [string, 'null']
        display_name:
          type: [string, 'null']
        avatar_url:
          type: [string, 'null']
        followed_at:
          type: string
          format: date-time
          description: When the edge was created (newest-first ordering key).

    FollowPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FollowItem'
        next_cursor:
          type: [string, 'null']
          description: |
            Opaque cursor for the next page; null on the last page.

    Post:
      type: object
      required: [id, author_id, text, media_ids, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          example: 7e2a8f4c-1b3d-4e5f-8a09-b1c2d3e4f506
        author_id:
          type: string
          format: uuid
          description: The author's user id.
          example: 3f6b1c9e-8b4a-4d2e-9f01-abc123def456
        text:
          type: string
          maxLength: 500
          description: Post body, max 500 runes (measured in runes, not bytes).
          example: Shipping the Wave 1 feed today.
        media_ids:
          type: array
          maxItems: 10
          description: |
            Media ids (max 10), grammar `[A-Za-z0-9_-]{1,128}`. Shape
            validated on create; readiness ("reference only ready media")
            is enforced by the media pipeline.
          items:
            type: string
          example: []
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PostCreate:
      type: object
      required: [text]
      description: |
        New post body. Unknown keys are rejected with 400 (strict API).
      properties:
        text:
          type: string
          maxLength: 500
          example: Shipping the Wave 1 feed today.
        media_ids:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,128}$'
          example: []
        auto_caption:
          type: boolean
          default: false
          description: |
            E3: request auto-captions for the post's video attachments.
            The caption worker transcribes ready videos and publishes
            VTT/SRT sidecars on the media row (caption_url). Best-effort
            and async — the 201 never waits for it.
      additionalProperties: false

    PostPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        next_cursor:
          type: [string, 'null']
          description: |
            Opaque cursor for the next page; null on the last page.

    MediaUploadRequest:
      type: object
      required: [kind, filename, mime_type]
      properties:
        kind:
          type: string
          enum: [video, image]
          example: video
        filename:
          type: string
          description: 1–255 bytes, no path separators.
          example: clip.mp4
        mime_type:
          type: string
          description: Must start with the kind (e.g. video/mp4).
          example: video/mp4
      additionalProperties: false

    UploadSession:
      type: object
      required: [media_id, upload_url, method]
      properties:
        media_id:
          type: string
          format: uuid
          description: The minted media id; poll it via GET /v1/media/{id}.
        upload_url:
          type: string
          format: uri
          description: Direct SeaweedFS PUT URL for the bytes.
        method:
          type: string
          enum: [PUT]

    Rendition:
      type: object
      required: [name, url, bandwidth, width, height]
      properties:
        name:
          type: string
          example: 720p
        url:
          type: string
          format: uri
          description: HLS playlist URL.
        bandwidth:
          type: integer
          format: int64
          description: Bits per second.
        width:
          type: integer
        height:
          type: integer

    Media:
      type: object
      required: [id, owner_id, kind, status, caption_status, renditions, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [video, image]
        status:
          type: string
          enum: [pending, uploaded, ready, failed]
          description: |
            pending: upload URL minted, no bytes yet. uploaded: bytes
            confirmed, video awaiting the transcode worker. ready: safe
            to reference from posts. failed: worker gave up; see error.
        filename:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          format: int64
          description: Set when the upload completes (HEAD of the file).
        width:
          type: integer
          description: Set by the transcode worker (video) or client metadata.
        height:
          type: integer
        duration_ms:
          type: integer
          format: int64
          description: Video only; set by the transcode worker.
        poster_url:
          type: string
          format: uri
          description: Video poster frame (set when ready).
        renditions:
          type: array
          items:
            $ref: '#/components/schemas/Rendition'
        playback_url:
          type: string
          format: uri
          description: |
            The original upload URL; for videos, prefer the master
            playlist once ready.
        error:
          type: string
          description: Failure reason when status is failed.
        auto_caption:
          type: boolean
          description: |
            Sticky opt-in (E3): true once captions were requested for
            this video (upload intent or POST /v1/posts auto_caption).
        caption_status:
          type: string
          enum: [none, requested, processing, ready, failed]
          description: |
            Caption worker lifecycle. none: never requested. requested:
            enqueued, awaiting the worker. processing: worker holds the
            job. ready: sidecars published, caption_url live. failed:
            worker gave up (reason is internal-only).
        caption_url:
          type: string
          format: uri
          description: |
            VTT sidecar of the transcription (caption_status=ready).
            Web players load VTT natively; an SRT twin sits alongside.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable code, derived from the status:
                bad_request (400), unauthorized (401), forbidden (403),
                not_found (404), method_not_allowed (405), conflict (409),
                unprocessable_entity (422), rate_limited (429),
                internal (500), service_unavailable (503); `error` for any
                other status. Codes are part of the contract — never rename.
              example: not_found
            message:
              type: string
              description: Human-readable detail (no stack traces, no driver text).
              example: not found
            request_id:
              type: string
              description: Echoes X-Request-ID for log correlation.
              example: 01J9X0ABCD...

  headers:
    XRequestID:
      description: |
        Request ID — client-supplied values are echoed, otherwise generated
        server-side. Present on every response, including errors and
        recovered panics.
      schema:
        type: string

  responses:
    Unauthorized:
      description: |
        Missing, malformed, expired, or wrong-signature bearer token.
        (Under AUTH_BYPASS=1 this path is disabled — all requests
        authenticate as the bypass subject.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: unauthorized
              message: unauthorized
              request_id: 01J9X0ABCD...
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'

    RateLimited:
      description: |
        Per-IP rate budget exhausted. Slow down and retry after the
        Retry-After delay.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: rate_limited
              message: too many requests; slow down and retry
              request_id: 01J9X0ABCD...
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          description: Seconds to wait before retrying (ceiling of the wait, at least 1).
          schema:
            type: integer
            example: 3
        X-RateLimit-Limit:
          description: Configured sustained requests/sec for this client IP.
          schema:
            type: integer
            example: 100

    InternalError:
      description: |
        Unexpected server failure. The message is generic by design —
        details go to the server log keyed by request_id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: internal
              message: internal server error
              request_id: 01J9X0ABCD...
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'

    NotFound:
      description: |
        Unknown path (also the catch-all for unknown /v1/* routes).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: not_found
              message: not found
              request_id: 01J9X0ABCD...
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
