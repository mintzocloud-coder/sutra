  /v1/search:
    get:
      tags: [commerce]
      summary: Product search (storefront)
      description: |
        The read half of F2 (Wave-3 product search), a dependency-aware
        proxy over self-hosted Meilisearch CE. Queries are ranked by
        Meilisearch's default rules on `q` (title outranks description,
        typo tolerance on); results within equal relevance come newest
        first (`updated_at desc, sort_seq desc` — `sort_seq` is the
        numeric keyset tie-breaker because Meilisearch range filters
        work on numbers only; see `docs/search.md`).
        Paging is a true keyset: pass the previous page's `next_cursor`
        as `cursor`; stop when `next_cursor` is absent. `status`
        defaults to `active` — a defense-in-depth second gate, since
        drafts/archived listings already leave the index on write.
        Indexing is async: a just-activated product may take a moment
        to appear (poll in integration tests). Search being down is a
        dependency outage, never a bug: expect 503
        `search_unavailable` + `Retry-After`, not 500.
      operationId: searchProducts
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Full-text query over title + description (≤ 200 chars). Empty = newest-first browse order.
          schema:
            type: string
            maxLength: 200
        - name: seller_id
          in: query
          required: false
          description: Filter to one seller's storefront.
          schema:
            type: string
            format: uuid
        - name: category_slug
          in: query
          required: false
          description: Filter to one category, e.g. `audio`.
          schema:
            type: string
            pattern: '^[a-z0-9-]{1,64}$'
        - name: status
          in: query
          required: false
          description: Document status gate; defaults to `active`.
          schema:
            type: string
            enum: [active, draft, archived]
            default: active
        - name: min_price_paise
          in: query
          required: false
          description: Price band over the document's `min_price_paise` (cheapest active variant). Non-negative integer.
          schema:
            type: integer
            minimum: 0
        - name: max_price_paise
          in: query
          required: false
          description: Upper bound of the price band; must be ≥ min_price_paise.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Page size, 1–50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from the previous page's `next_cursor`. Malformed cursors are 400.
          schema:
            type: string
      responses:
        '200':
          description: One page of search hits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: |
            Malformed param (`invalid_query`, `invalid_seller_id`,
            `invalid_category_slug`, `invalid_status`, `invalid_min_price`,
            `invalid_max_price`, `invalid_price_range`, `invalid_limit`,
            `invalid_cursor`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: |
            Search unavailable — disabled (no master key) or the
            Meilisearch cluster is down. Retry after the `Retry-After`
            window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: User UUID.
      schema:
        type: string
        format: uuid
        example: 3f6b1c9e-8b4a-4d2e-9f01-abc123def456
    PostId:
      name: id
      in: path
      required: true
      description: Post UUID.
      schema:
        type: string
        format: uuid
        example: 7e2a8f4c-1b3d-4e5f-8a09-b1c2d3e4f506
    MediaId:
      name: id
      in: path
      required: true
      description: Media UUID.
      schema:
        type: string
        format: uuid
        example: 9c1f7a4d-2e6b-4a3f-8c5d-e7f9a1b2c3d4
    PageLimit:
      name: limit
      in: query
      required: false
      description: |
        Page size, 1–100. Above 100 clamps to 100; non-positive or
        non-integer values are 400.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PageCursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor from the previous page's `next_cursor`. Malformed
        cursors are 400.
      schema:
        type: string
    SellerId:
      name: id
      in: path
      required: true
      description: Seller UUID.
      schema:
        type: string
        format: uuid
    ProductId:
      name: id
      in: path
      required: true
      description: Product UUID.
      schema:
        type: string
        format: uuid
    VariantId:
      name: id
      in: path
      required: true
      description: Variant UUID.
      schema:
        type: string
        format: uuid
    CommerceListLimit:
      name: limit
      in: query
      required: false
      description: |
        Commerce page size, 1–50. Out-of-range or non-integer values are 400.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    TranslateTarget:
      name: translate
      in: query
      required: false
      description: |
        E4 language bridge. When set, each item's body is translated
        best-effort into this language alongside the original
        (`translated_text` / `translated_from` appear on the item only
        when a translation actually happened). Translation is
        read-time decoration: a downed or slow translation backend
        degrades to the original text, never a feed failure. An
        unsupported value is 400 `invalid_translate_target`.
      schema:
        type: string
        enum: [hi, gu, ta, bn, te, kn, ml, mr, pa, or, as, ur, ne, en]

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256 JWT from the OIDC issuer (Hydra). Verified against the issuer's
        JWKS with a 15-minute cache and refresh-on-unknown-kid for rotation;
        alg is pinned to RS256 (alg:none/HS256 rejected); exp (60s leeway),
        iss and aud enforced. Default issuer http://hydra:4444, default
        audience sutra-api — see HYDRA_ISSUER / JWT_AUDIENCE env vars.
        AUTH_BYPASS=1 disables verification for local development (every
        request authenticates as AUTH_BYPASS_SUBJECT, default `dev-user`;
        loudly logged as insecure — never enable in production).

  schemas:
    User:
      type: object
      required: [id, subject, display_name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Primary key (uuid via pgcrypto).
          example: 3f6b1c9e-8b4a-4d2e-9f01-abc123def456
        subject:
          type: string
          description: OIDC subject — the stable identity key, unique. Never exposed on public profile reads.
          example: 8f3a2b1c-4d5e-4f60-9a1b-2c3d4e5f6071
        display_name:
          type: [string, 'null']
          description: |
            Seeded from OIDC claims on first sight, never overwritten on
            later calls.
          example: Harshal Vanpariya
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Profile:
      type: object
      required: [user_id, handle, display_name, bio, avatar_url, followers_count, following_count, created_at, updated_at]
      properties:
        user_id:
          type: string
          format: uuid
          example: 3f6b1c9e-8b4a-4d2e-9f01-abc123def456
        handle:
          type: [string, 'null']
          description: |
            First-come unique handle, `[a-z0-9_]{3,20}`; null until claimed.
          example: dhanasvi
        display_name:
          type: [string, 'null']
          description: |
            Profile display name when set, otherwise the OIDC-seeded name
            from the identity record.
          example: Dhanasvi
        bio:
          type: [string, 'null']
          maxLength: 160
          example: Building Sutra.
        avatar_url:
          type: [string, 'null']
          description: Must be an http(s) URL when set.
          example: https://cdn.example/avatars/d.png
        followers_count:
          type: integer
          description: Computed live from the follow graph (not denormalized).
          example: 128
        following_count:
          type: integer
          example: 42
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProfilePatch:
      type: object
      description: |
        Partial profile update: only present keys change; present-but-null
        clears the field. Unknown keys are rejected.
      properties:
        handle:
          type: [string, 'null']
          description: Grammar `[a-z0-9_]{3,20}`; null clears the claim.
          example: dhanasvi
        display_name:
          type: [string, 'null']
          maxLength: 80
        bio:
          type: [string, 'null']
          maxLength: 160
        avatar_url:
          type: [string, 'null']
          description: Must be an http(s) URL when set.
      additionalProperties: false

    FollowItem:
      type: object
      required: [id, handle, display_name, avatar_url, followed_at]
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: [string, 'null']
        display_name:
          type: [string, 'null']
        avatar_url:
          type: [string, 'null']
        followed_at:
          type: string
          format: date-time
          description: When the edge was created (newest-first ordering key).

    FollowPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FollowItem'
        next_cursor:
          type: [string, 'null']
          description: |
            Opaque cursor for the next page; null on the last page.

    Post:
      type: object
      required: [id, author_id, text, media_ids, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          example: 7e2a8f4c-1b3d-4e5f-8a09-b1c2d3e4f506
        author_id:
          type: string
          format: uuid
          description: The author's user id.
          example: 3f6b1c9e-8b4a-4d2e-9f01-abc123def456
        text:
          type: string
          maxLength: 500
          description: Post body, max 500 runes (measured in runes, not bytes).
          example: Shipping the Wave 1 feed today.
        media_ids:
          type: array
          maxItems: 10
          description: |
            Media ids (max 10), grammar `[A-Za-z0-9_-]{1,128}`. Shape
            validated on create; readiness ("reference only ready media")
            is enforced by the media pipeline.
          items:
            type: string
          example: []
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PostCreate:
      type: object
      required: [text]
      description: |
        New post body. Unknown keys are rejected with 400 (strict API).
      properties:
        text:
          type: string
          maxLength: 500
          example: Shipping the Wave 1 feed today.
        media_ids:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,128}$'
          example: []
        auto_caption:
          type: boolean
          default: false
          description: |
            E3: request auto-captions for the post's video attachments.
            The caption worker transcribes ready videos and publishes
            VTT/SRT sidecars on the media row (caption_url). Best-effort
            and async — the 201 never waits for it.
      additionalProperties: false

    PostPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        next_cursor:
          type: [string, 'null']
          description: |
            Opaque cursor for the next page; null on the last page.

    LikeResult:
      type: object
      required: [liked, like_count]
      properties:
        liked:
          type: boolean
          description: Whether the caller currently likes the post.
        like_count:
          type: integer
          minimum: 0
          description: Current all-time like count of the post.

    FeedItem:
      allOf:
        - $ref: '#/components/schemas/Post'
        - type: object
          description: |
            A home-feed entry. `translated_text` / `translated_from`
            appear only when GET /v1/feed/home was called with
            ?translate= and the translation succeeded (best-effort).
          properties:
            translated_text:
              type: string
              description: The post body rendered in the requested target language.
            translated_from:
              type: string
              description: Detected source language (ISO 639-1) of the original text.

    FeedPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedItem'
        next_cursor:
          type: [string, 'null']
          description: |
            Opaque cursor for the next page; null on the last page.

    MediaUploadRequest:
      type: object
      required: [kind, filename, mime_type]
      properties:
        kind:
          type: string
          enum: [video, image]
          example: video
        filename:
          type: string
          description: 1–255 bytes, no path separators.
          example: clip.mp4
        mime_type:
          type: string
          description: Must start with the kind (e.g. video/mp4).
          example: video/mp4
      additionalProperties: false

    UploadSession:
      type: object
      required: [media_id, upload_url, method]
      properties:
        media_id:
          type: string
          format: uuid
          description: The minted media id; poll it via GET /v1/media/{id}.
        upload_url:
          type: string
          format: uri
          description: Direct SeaweedFS PUT URL for the bytes.
        method:
          type: string
          enum: [PUT]

    Rendition:
      type: object
      required: [name, url, bandwidth, width, height]
      properties:
        name:
          type: string
          example: 720p
        url:
          type: string
          format: uri
          description: HLS playlist URL.
        bandwidth:
          type: integer
          format: int64
          description: Bits per second.
        width:
          type: integer
        height:
          type: integer

    Media:
      type: object
      required: [id, owner_id, kind, status, caption_status, renditions, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [video, image]
        status:
          type: string
          enum: [pending, uploaded, ready, failed]
          description: |
            pending: upload URL minted, no bytes yet. uploaded: bytes
            confirmed, video awaiting the transcode worker. ready: safe
            to reference from posts. failed: worker gave up; see error.
        filename:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          format: int64
          description: Set when the upload completes (HEAD of the file).
        width:
          type: integer
          description: Set by the transcode worker (video) or client metadata.
        height:
          type: integer
        duration_ms:
          type: integer
          format: int64
          description: Video only; set by the transcode worker.
        poster_url:
          type: string
          format: uri
          description: Video poster frame (set when ready).
        renditions:
          type: array
          items:
            $ref: '#/components/schemas/Rendition'
        playback_url:
          type: string
          format: uri
          description: |
            The original upload URL; for videos, prefer the master
            playlist once ready.
        error:
          type: string
          description: Failure reason when status is failed.
        auto_caption:
          type: boolean
          description: |
            Sticky opt-in (E3): true once captions were requested for
            this video (upload intent or POST /v1/posts auto_caption).
        caption_status:
          type: string
          enum: [none, requested, processing, ready, failed]
          description: |
            Caption worker lifecycle. none: never requested. requested:
            enqueued, awaiting the worker. processing: worker holds the
            job. ready: sidecars published, caption_url live. failed:
            worker gave up (reason is internal-only).
        caption_url:
          type: string
          format: uri
          description: |
            VTT sidecar of the transcription (caption_status=ready).
            Web players load VTT natively; an SRT twin sits alongside.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Seller:
      type: object
      required: [id, store_name, store_slug, status, commission_rate_bps, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        store_name:
          type: string
          example: Shivam Electronics
        store_slug:
          type: string
          description: First-come store handle, unique, `[a-z0-9-]{3,30}`.
          example: shivam-electronics
        status:
          type: string
          enum: [active, suspended]
        commission_rate_bps:
          type: integer
          description: Basis points; 0 = the 0%-commission marketplace model.
          example: 0
        gstin:
          type: string
          description: Present only when the seller supplied one.
          example: 24ABCDE1234F1Z5
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SellerCreate:
      type: object
      required: [store_name]
      additionalProperties: false
      properties:
        store_name:
          type: string
          minLength: 1
          description: 3–80 runes (rune-counted, not bytes).
        store_slug:
          type: string
          description: |
            Optional; derived from the store name when omitted. Lowercased
            server-side.
        gstin:
          type: string
          description: |
            Optional; validated as a 15-character GSTIN and uppercased
            server-side.
    CategoryNode:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: audio
        name:
          type: string
          example: Audio
        parent_id:
          type: string
          format: uuid
          description: Absent on root categories.
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
    CategoryTree:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          description: Root categories with nested children.
          items:
            $ref: '#/components/schemas/CategoryNode'
    Product:
      type: object
      required: [id, seller_id, title, description, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
          description: Absent when the product is uncategorized.
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, active, archived]
          description: |
            New listings start as draft — invisible on the storefront until
            activated. archived: owner archive (never hard-deleted).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductCreate:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
        description:
          type: string
        category_slug:
          type: string
          description: Must exist in the curated tree (`category_not_found` otherwise).
        status:
          type: string
          enum: [draft, active, archived]
          description: Defaults to draft when omitted.
    ProductPatch:
      type: object
      additionalProperties: false
      description: |
        Partial edit; explicit null on any field means "leave unchanged"
        (except category_slug, where "" clears the category).
      properties:
        title:
          type: string
        description:
          type: string
        category_slug:
          type: string
          description: Empty string clears the category.
        status:
          type: string
          enum: [draft, active, archived]
    ProductPage:
      type: object
      required: [products]
      properties:
        products:
          type: array
          description: Newest first, keyset-paged on (created_at, id).
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: string
          description: |
            Product id of the last returned item; pass as `cursor` for the
            next page. Null when this is the last page.
    Variant:
      type: object
      required: [id, product_id, sku, price_paise, attributes, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        sku:
          type: string
          description: Unique per product.
        price_paise:
          type: integer
          format: int64
          description: Integer paise — money is never a float.
          example: 149900
        mrp_paise:
          type: integer
          format: int64
          description: Absent when no MRP; always ≥ price_paise when set.
        attributes:
          type: object
          additionalProperties:
            type: string
          description: String→string bag (color, size, …).
          example: {color: black}
        status:
          type: string
          enum: [active, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VariantCreate:
      type: object
      required: [sku, price_paise]
      additionalProperties: false
      properties:
        sku:
          type: string
        price_paise:
          type: integer
          format: int64
          description: Integer paise.
        mrp_paise:
          type: integer
          format: int64
          description: Null/omitted means no MRP.
          nullable: true
        attributes:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
          enum: [active, archived]
          description: Defaults to active when omitted.
    VariantPatch:
      type: object
      additionalProperties: false
      description: |
        Partial edit; explicit null on a field means "leave unchanged",
        EXCEPT mrp_paise, where explicit null clears the MRP.
      properties:
        sku:
          type: string
        price_paise:
          type: integer
          format: int64
        mrp_paise:
          type: integer
          format: int64
          description: Explicit null clears the MRP.
          nullable: true
        attributes:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
          enum: [active, archived]
    Inventory:
      type: object
      required: [variant_id, quantity, reserved, available, updated_at]
      properties:
        variant_id:
          type: string
          format: uuid
        quantity:
          type: integer
          description: Total units on hand.
        reserved:
          type: integer
          description: |
            Units held by in-flight orders; owned by the F6 order saga,
            never touched by the adjust endpoint.
        available:
          type: integer
          description: quantity − reserved (what buyers may buy).
        updated_at:
          type: string
          format: date-time
    InventoryAdjust:
      type: object
      required: [delta]
      additionalProperties: false
      properties:
        delta:
          type: integer
          description: |
            Signed stock movement (may be negative). One atomic UPDATE;
            409 `insufficient_stock` when it would drive quantity below
            zero.
          example: 100

    SearchProductHit:
      type: object
      required: [id, title, description, seller_id, status, updated_at_unix, sort_seq]
      description: |
        One Meilisearch `products` index document (F2). The search view
        of a product: cheapest active variant's price as `min_price_paise`
        (the storefront's "from ₹X" badge), numeric `sort_seq` as the
        keyset tie-breaker.
      properties:
        id:
          type: string
          format: uuid
          description: Product id (index primary key).
        title:
          type: string
          description: Searchable; outranks description.
        description:
          type: string
          description: Searchable.
        seller_id:
          type: string
          format: uuid
        category_slug:
          type: string
          description: From the category tree; absent when uncategorized.
          example: audio
        status:
          type: string
          enum: [active, draft, archived]
        min_price_paise:
          type: integer
          description: |
            Cheapest ACTIVE variant's price (integer paise); absent when
            no active variants exist.
          example: 149900
        updated_at_unix:
          type: integer
          description: Product `updated_at` as unix seconds — sort key.
        sort_seq:
          type: integer
          description: |
            `products.search_seq` identity value — numeric tie-breaker
            for keyset paging (Meilisearch range filters are
            numbers-only).
    SearchPage:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          description: Ordered `updated_at_unix desc, sort_seq desc` (relevance first within equal order).
          items:
            $ref: '#/components/schemas/SearchProductHit'
        next_cursor:
          type: string
          description: |
            Opaque base64url cursor over the last hit's
            `(updated_at_unix, sort_seq)`; pass as `cursor` for the
            next page. Absent on the last page.

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable code, derived from the status:
                bad_request (400), unauthorized (401), forbidden (403),
                not_found (404), method_not_allowed (405), conflict (409),
                unprocessable_entity (422), rate_limited (429),
                internal (500), service_unavailable (503); `error` for any
                other status. Codes are part of the contract — never rename.
              example: not_found
            message:
              type: string
              description: Human-readable detail (no stack traces, no driver text).
              example: not found
            request_id:
              type: string
              description: Echoes X-Request-ID for log correlation.
              example: 01J9X0ABCD...
    AguiMessage:
      type: object
      description: One message in an AG-UI run input (E1 subset).
      properties:
        role:
          type: string
          example: user
        content:
          type: string
          example: hello
    RunAgentInput:
      type: object
      description: |
        AG-UI RunAgentInput (E1 subset): thread/run identity, the message
        list, and an opaque state bag the client owns. thread_id/run_id
        default to server-minted values when omitted.
      properties:
        thread_id:
          type: string
          example: thread-a1b2c3d4e5f6
        run_id:
          type: string
          example: run-0f9e8d7c6b5a
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AguiMessage'
        state:
          type: object
          description: Opaque client-owned state bag, echoed back untouched.
    ChatInput:
      type: object
      description: |
        E2 personal-AI chat input. thread_id is the client's conversation
        key (scoped to the user); omit it to start a new thread — the
        minted id comes back in RUN_STARTED's threadId. Only the last
        user message is answered; memory comes from the thread.
      properties:
        thread_id:
          type: string
          maxLength: 128
          example: thread-a1b2c3d4e5f6
        messages:
          type: array
          description: Message history tail for this turn (max 8000 chars per message).
          items:
            $ref: '#/components/schemas/AguiMessage'
    AguiEvent:
      type: object
      description: |
        One AG-UI 1.0 BaseEvent carried in an SSE `data:` frame
        (`data: {"type":"RUN_STARTED",...}\n\n`). The `type` field selects
        the rest: RUN_STARTED (threadId, runId), STEP_STARTED/STEP_FINISHED
        (stepName), TEXT_MESSAGE_START (messageId, role),
        TEXT_MESSAGE_CONTENT (messageId, delta), TEXT_MESSAGE_END
        (messageId), RUN_FINISHED (threadId, runId),
        RUN_ERROR (message).
      properties:
        type:
          type: string
          example: TEXT_MESSAGE_CONTENT
      additionalProperties: true

  headers:
    XRequestID:
      description: |
        Request ID — client-supplied values are echoed, otherwise generated
        server-side. Present on every response, including errors and
        recovered panics.
      schema:
        type: string

  responses:
    Unauthorized:
      description: |
        Missing, malformed, expired, or wrong-signature bearer token.
        (Under AUTH_BYPASS=1 this path is disabled — all requests
        authenticate as the bypass subject.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: unauthorized
              message: unauthorized
              request_id: 01J9X0ABCD...
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'

    RateLimited:
      description: |
        Per-IP rate budget exhausted. Slow down and retry after the
        Retry-After delay.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: rate_limited
              message: too many requests; slow down and retry
              request_id: 01J9X0ABCD...
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          description: Seconds to wait before retrying (ceiling of the wait, at least 1).
          schema:
            type: integer
            example: 3
        X-RateLimit-Limit:
          description: Configured sustained requests/sec for this client IP.
          schema:
            type: integer
            example: 100

    InternalError:
      description: |
        Unexpected server failure. The message is generic by design —
        details go to the server log keyed by request_id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: internal
              message: internal server error
              request_id: 01J9X0ABCD...
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'

    NotFound:
      description: |
        Unknown path (also the catch-all for unknown /v1/* routes).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: not_found
              message: not found
              request_id: 01J9X0ABCD...
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
