# Sutra API — OpenAPI 3.1 spec (services/api, Go)
#
# GENERATED BY HAND, not from code annotations: keep this file in sync with
# services/api/cmd/api/main.go and the internal/middleware + internal/users
# packages on every route change. CI validates this file on every push.
openapi: 3.1.0
info:
  title: Sutra API
  version: 1.0.0
  description: |
    Core REST API of the Sutra backend (Go service). Realtime messaging
    lives in the Elixir chat service (Phoenix channels, not REST); this
    spec covers the HTTP surface of services/api only.

    Conventions that apply to every endpoint:
    * Every response carries an `X-Request-ID` header (generated server-side
      when the client does not send one, echoed back when it does).
    * Every non-2xx response uses the JSON error envelope
      `{"error": {"code", "message", "request_id"}}`; machine-readable
      `code` values are stable and part of the contract (never rename).
    * Baseline security headers on all responses: X-Content-Type-Options:
      nosniff, X-Frame-Options: DENY, Referrer-Policy:
      strict-origin-when-cross-origin, Content-Security-Policy:
      `default-src 'none'; frame-ancestors 'none'`.
    * Rate limiting is per client IP (token bucket; RATE_LIMIT_RPS default
      100, RATE_LIMIT_BURST default 200). Non-preflight responses carry
      `X-RateLimit-Limit`; 429 responses add `Retry-After` (seconds) and use
      the error envelope with code `rate_limited`.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: http://localhost:8081
    description: Local docker-compose API (container port 8080, host 8081)
  - url: https://api.botsteam.example
    description: Production (placeholder — set the real host when deployed)
tags:
  - name: system
    description: Liveness / readiness probes (unauthenticated, DB-free for /healthz)
  - name: identity
    description: Authenticated caller identity
  - name: commerce
    description: |
      Wave-3 marketplace: seller onboarding, curated categories, product
      catalog (products, purchasable variants, inventory). Write routes are
      owner-only — the caller must have a seller account and own the
      resource; reads are public storefront reads. Money is always integer
      paise (`price_paise`, `mrp_paise`); the platform commission is 0%
      (`commission_rate_bps` default 0).
paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      description: |
        Returns 200 while the process is alive. Never depends on the
        database, so orchestrators can distinguish a dead process from a
        process that merely lost its DB.
      operationId: healthz
      security: []
      responses:
        '200':
          description: Process alive
          content:
            text/plain:
              schema:
                type: string
                example: ok
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/ai/healthz:
    get:
      tags: [ai]
      summary: AI service liveness (proxied)
      description: |
        Proxied to the Python AI service's own /healthz (the /v1/ai prefix
        is stripped by the Go proxy). Requires the caller's JWT (same as
        every /v1/* route); the proxy adds the internal service Bearer
        token and forwards the verified subject as X-Sutra-Subject.
        With AI_SERVICE_TOKEN empty the proxy answers 503
        (service_unavailable); with the AI service down it answers 503 +
        Retry-After. All /v1/ai/* routes (healthz, ag-ui/run, chat,
        translate) are documented in this spec; the contract is in
        docs/ai-core.md.
      operationId: aiHealthz
      security:
        - bearerAuth: []
      responses:
        '200':
          description: AI service alive (proxied payload)
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: sutra-ai
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: AI service not configured or unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/ai/translate:
    post:
      tags: [ai]
      summary: Translate text (IndicTrans2, proxied)
      description: |
        Proxied to the Python AI service's /translate (the /v1/ai prefix is
        stripped by the Go proxy). Requires the caller's JWT; the proxy adds
        the internal service Bearer token and forwards the verified subject
        as X-Sutra-Subject. Translates post/comment-sized text between en
        and Indic languages (hi, gu, ta, bn, te, kn, ml, mr, pa, or, as,
        ur, ne) via AI4Bharat IndicTrans2 checkpoints (MIT). Results are
        cached in Valkey by (content-hash, target) for 30 days — `cached`
        tells you whether this response came from cache. `source: "auto"`
        resolves via Unicode script detection (ASCII -> en, Devanagari ->
        hi, ...); pass an explicit ISO code when detection fails. Per-user
        rate limit (TRANSLATE_RPM, default 30/min) -> 429
        `translate_rate_limited` with Retry-After. With AI_SERVICE_TOKEN
        empty or the AI service down the proxy answers 503
        (service_unavailable); a missing IndicTrans2 runtime answers 503
        `translate_unavailable` (fail-closed, never a silent stub).
        Contract: docs/language-bridge.md.
      operationId: aiTranslate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Text to translate (max 4000 chars)
                  example: Hello, how are you?
                source:
                  type: string
                  description: ISO 639-1 source code, or "auto"
                  default: auto
                  example: auto
                target:
                  type: string
                  description: ISO 639-1 target code
                  default: en
                  example: hi
      responses:
        '200':
          description: Translation result
          content:
            application/json:
              schema:
                type: object
                required: [text, source, target, cached, model]
                properties:
                  text:
                    type: string
                    example: नमस्ते, आप कैसे हैं?
                  source:
                    type: string
                    description: Resolved ISO 639-1 source code
                    example: en
                  target:
                    type: string
                    example: hi
                  cached:
                    type: boolean
                    description: True when served from the Valkey cache
                  model:
                    type: string
                    description: Backend that produced the text
                    example: indictrans2
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Invalid input (empty_text, text_too_long, invalid_language)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: AI service not configured/unreachable, or the IndicTrans2 runtime is not installed (translate_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/ai/ag-ui/run:
    post:
      tags: [ai]
      summary: AG-UI agent run (echo skeleton, proxied, SSE)
      description: |
        Proxied to the Python AI service's /ag-ui/run (the /v1/ai prefix is
        stripped by the Go proxy). Requires the caller's JWT; the proxy adds
        the internal service Bearer <redacted> and forwards the verified subject
        as X-Sutra-Subject. Accepts a RunAgentInput, streams AG-UI 1.0
        BaseEvents as SSE over the echo graph:
        RUN_STARTED -> STEP_STARTED(echo) -> STEP_FINISHED(echo) ->
        TEXT_MESSAGE_START -> TEXT_MESSAGE_CONTENT -> TEXT_MESSAGE_END ->
        RUN_FINISHED (graph failure mid-stream becomes RUN_ERROR).
        Abuse guards (E6): X-Sutra-Subject is required (401 without it);
        per-user fixed-window rate limit (AI_AGUI_RPM, default 60/min) ->
        429 `ai_rate_limited` with Retry-After. No token budget applies —
        the echo turn spends zero model tokens.
        Contract: docs/ai-core.md.
      operationId: aiAgUiRun
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunAgentInput'
      responses:
        '200':
          description: SSE stream of AG-UI BaseEvents
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AguiEvent'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Per-user AG-UI rate limit exceeded (ai_rate_limited) or the Go API per-IP limiter fired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Retry-After:
              type: integer
              description: Seconds until the next fixed window
        '503':
          description: AI service not configured or unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/ai/chat:
    post:
      tags: [ai]
      summary: Personal AI chat (proxied, SSE)
      description: |
        Proxied to the Python AI service's /chat (the /v1/ai prefix is
        stripped by the Go proxy). Requires the caller's JWT; the proxy adds
        the internal service Bearer <redacted> and forwards the verified subject
        as X-Sutra-Subject. One LangGraph turn (recall -> generate ->
        persist) with PG-backed per-user conversation memory keyed by
        thread_id, the versioned system prompt (AI_PROMPT_VERSION, never
        hardcoded), and per-delta streaming via LangGraph custom stream
        mode. Event sequence: RUN_STARTED (carries the minted threadId when
        omitted) -> STEP_STARTED(recall) -> STEP_FINISHED -> STEP_STARTED
        (generate) -> TEXT_MESSAGE_START -> TEXT_MESSAGE_CONTENT* ->
        TEXT_MESSAGE_END -> STEP_FINISHED -> STEP_STARTED(persist) ->
        STEP_FINISHED -> RUN_FINISHED (failures become RUN_ERROR).
        Guards run EAGERLY before streaming, so rejections are JSON 429s
        (never truncated streams): per-user fixed-window rate limit
        (AI_CHAT_RPM, default 20/min) -> `ai_rate_limited`, and daily
        token budget (AI_DAILY_TOKEN_BUDGET, default 50000/day) ->
        `ai_budget_exhausted`, both with Retry-After.
        With AI_SERVICE_TOKEN empty or the AI service down the proxy
        answers 503 (service_unavailable).
        Contract: docs/ai-core.md.
      operationId: aiChat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatInput'
      responses:
        '200':
          description: SSE stream of AG-UI BaseEvents for the chat turn
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AguiEvent'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Invalid input (empty_messages, message_too_long)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Per-user chat rate limit (ai_rate_limited) or daily token budget exhausted (ai_budget_exhausted); the Go API per-IP limiter shares this envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Retry-After:
              type: integer
              description: Seconds until the next window / UTC midnight
        '503':
          description: AI service not configured or unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /readyz:
    get:
      tags: [system]
      summary: Readiness probe
      description: |
        Returns 200 when the API can serve traffic (currently: the
        PostgreSQL pool answers a ping). Returns 503 with the error envelope
        when the database is unreachable so the orchestrator stops routing
        traffic until it recovers.
      operationId: readyz
      security: []
      responses:
        '200':
          description: Ready to serve
          content:
            text/plain:
              schema:
                type: string
                example: ok
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: service_unavailable
                  message: "not ready: database unreachable"
                  request_id: 01J9X0ABCD...
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'

  /v1/me:
    get:
      tags: [identity]
      summary: Get caller identity
      description: |
        Returns the identity record for the authenticated caller. The row is
        provisioned just-in-time on first sight (INSERT ... ON CONFLICT is
        race-safe), so a valid token never 404s here — it gets its own
        record. `display_name` is seeded from the OIDC `name` /
        `preferred_username` claims on first sight and never overwritten;
        the public handle lives on the profile (PATCH /v1/me/profile),
        not on this record.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Caller identity record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: |
            Wrong method — this route only supports GET. The `Allow` header
            names the supported methods.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: method_not_allowed
                  message: method not allowed
                  request_id: 01J9X0ABCD...
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: GET
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/me/profile:
    patch:
      tags: [social]
      summary: Update caller profile
      description: |
        Partial update of the caller's public profile; the profiles row is
        created on first use (lazy — reads of users without a profile fall
        back to the identity record). Only the keys present in the body
        change; a present-but-null key clears that field. Unknown keys are
        rejected with 400 (strict API). Handle claims are first-come:
        grammar `[a-z0-9_]{3,20}`; a taken handle is 409 `handle_taken`.
      operationId: patchMyProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
            example:
              handle: dhanasvi
              display_name: Dhanasvi
              bio: Building Sutra.
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed JSON body or unknown field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: Wrong method — this route only supports PATCH.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: PATCH
        '409':
          description: |
            Handle already claimed by another user (error code "handle_taken").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: handle_taken
                  message: handle is already taken
                  request_id: 01J9X0ABCD...
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '422':
          description: |
            Validation failure — `invalid_handle` (grammar), `field_too_long`,
            or `invalid_avatar_url` (must be http(s)).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/users/{id}:
    get:
      tags: [social]
      summary: Get public profile
      description: |
        Public profile for any user. Users without a profiles row still
        resolve (handle null, display name falls back to the OIDC seed).
        The OIDC subject is never exposed here — the handle is the public
        identifier. Follower/following counts are computed live.
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed user id (not a UUID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: invalid_user_id
                  message: user id must be a UUID
                  request_id: 01J9X0ABCD...
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such user (error code "user_not_found").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/users/{id}/follow:
    post:
      tags: [social]
      summary: Follow a user
      description: |
        Creates the follow edge caller → user. Idempotent: the first call
        is 201, repeats are 200 — retries never error. Following yourself
        is 422 `cannot_follow_self`; an unknown user is 404. A rolling
        per-user velocity cap applies (default 200 new follows/hour,
        `FOLLOW_VELOCITY_PER_HOUR`): over the cap is 429
        `follow_velocity_limited` with a Retry-After header telling the
        client when the oldest follow in the window ages out.
      operationId: followUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Already following (idempotent retry)
          content:
            application/json:
              schema:
                type: object
                required: [following, user_id]
                properties:
                  following:
                    type: boolean
                    example: true
                  user_id:
                    type: string
                    format: uuid
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '201':
          description: Follow edge created
          content:
            application/json:
              schema:
                type: object
                required: [following, user_id]
                properties:
                  following:
                    type: boolean
                    example: true
                  user_id:
                    type: string
                    format: uuid
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed user id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '405':
          description: Wrong method — this route supports POST and DELETE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: POST, DELETE
        '422':
          description: Cannot follow yourself (error code "cannot_follow_self").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [social]
      summary: Unfollow a user
      description: |
        Removes the follow edge caller → user. Idempotent: 204 whether or
        not the edge existed.
      operationId: unfollowUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Edge removed (or never existed)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed user id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '405':
          description: Wrong method — this route supports POST and DELETE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: POST, DELETE
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/users/{id}/followers:
    get:
      tags: [social]
      summary: List followers
      description: |
        Users following this user, newest first. Keyset-paginated on
        (created_at, edge id) — pass `next_cursor` for the next page; null
        `next_cursor` means the last page. No OFFSET, so pages stay stable
        as the graph grows.
      operationId: listFollowers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: One page of followers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowPage'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed user id, bad limit, or bad cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/users/{id}/following:
    get:
      tags: [social]
      summary: List following
      description: |
        Users this user follows, newest first. Same keyset pagination as
        /followers.
      operationId: listFollowing
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: One page of followed users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowPage'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed user id, bad limit, or bad cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/posts:
    post:
      tags: [posts]
      summary: Publish a post
      description: |
        Publishes a post as the caller. Body text is capped at 500 runes
        (measured in runes, not bytes, so emoji-heavy posts are measured
        fairly); blank bodies are 422. media_ids are validated for shape
        (`[A-Za-z0-9_-]{1,128}`, max 10 per post) — the readiness gate
        ("reference only ready media") is enforced by the media pipeline
        (D4), not here. A per-author rolling velocity cap applies (default
        30 posts/hour, `POST_VELOCITY_PER_HOUR`): over the cap is 429
        `post_velocity_limited` with a Retry-After header telling the
        client when the oldest post in the window ages out.
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreate'
            example:
              text: Shipping the Wave 1 feed today.
              media_ids: []
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed JSON body or unknown field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: Wrong method — this route only supports POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: POST
        '422':
          description: |
            Validation failure — `empty_post` (blank body), `post_too_long`
            (>500 runes), `too_many_media` (>10), or `invalid_media_id`
            (grammar).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          description: |
            Over the per-author velocity cap (error code
            "post_velocity_limited"); the Retry-After header carries the
            wait in seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Retry-After:
              description: Seconds until the oldest post in the rolling window ages out
              schema:
                type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/posts/{id}:
    delete:
      tags: [posts]
      summary: Delete a post
      description: |
        Deletes a post. Author-only: 403 `post_not_author` when the caller
        is not the author; 404 `post_not_found` for unknown ids (deleting
        an already-gone post is a client bug worth surfacing, unlike the
        idempotent unfollow).
      operationId: deletePost
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '204':
          description: Post deleted
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed post id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the post's author.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '404':
          description: No such post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '405':
          description: Wrong method — this route only supports DELETE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: DELETE
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/posts/{id}/like:
    post:
      tags: [posts, engagement]
      summary: Like a post
      description: |
        Records the caller's like. Idempotent: liking twice is a no-op
        (201 first time, 200 on retry — mirroring follow). Likes are the
        engagement signal feeding the v1 home-feed ranker (docs/recsys.md).
      operationId: likePost
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '201':
          description: Post liked (first time).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeResult'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '200':
          description: Already liked (idempotent retry); current count returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeResult'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed post id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '405':
          description: Wrong method — this route only supports POST and DELETE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: POST, DELETE
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [posts, engagement]
      summary: Unlike a post
      description: |
        Removes the caller's like. Idempotent "ensure absent": unliking an
        unliked (or unknown) post is a no-op success — 200 with the current
        count so clients can update UI state without a refetch.
      operationId: unlikePost
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Like removed (or was already absent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeResult'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed post id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/media/upload:
    post:
      tags: [media]
      summary: Start a media upload
      description: |
        Mints a media row and returns a direct SeaweedFS PUT URL
        ("presigned" here means pre-assigned: no signature or expiry —
        security comes from unguessable fids, the status lifecycle, and
        the network boundary). Bytes go straight to SeaweedFS and never
        through the API. The row starts `pending`; the client PUTs its
        file, then calls `/v1/media/{id}/complete`. Storage-master
        outages are 503 `media_unavailable` with Retry-After.
      operationId: createMediaUpload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadRequest'
            example:
              kind: video
              filename: clip.mp4
              mime_type: video/mp4
      responses:
        '201':
          description: Upload session minted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed JSON body or unknown field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: |
            `invalid_media_kind` (kind not video/image),
            `invalid_mime_type` (mime must start with the kind, e.g.
            video/mp4), `invalid_filename` (1–255 bytes, no path
            separators).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: |
            `media_unavailable` — the storage master is unreachable.
            Retriable; carries Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'

  /v1/media/{id}:
    get:
      tags: [media]
      summary: Get one media record
      description: |
        Returns the media row, including lifecycle status. Clients poll
        this while a video transcodes (status `uploaded` → `ready` or
        `failed`). Media ids are unguessable UUIDs and rows carry no
        PII, so any authenticated user may read.
      operationId: getMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: The media record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Media id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No media with that id (`media_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/media/{id}/complete:
    post:
      tags: [media]
      summary: Mark an upload complete
      description: |
        Called after the client PUT its bytes to the upload URL. The
        API HEADs the file on SeaweedFS to confirm bytes landed (size
        > 0): images go straight to `ready`; videos go to `uploaded`
        and are enqueued for the transcode worker (D4 part 2). Re-
        completing a finished upload is 409 `upload_already_completed`;
        completing someone else's upload is 403 `media_not_owned`.
      operationId: completeMediaUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Media advanced to its next status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Media id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The media belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '404':
          description: No media with that id (`media_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '409':
          description: Upload already completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '422':
          description: |
            `upload_bytes_missing` — no bytes found at the upload URL;
            PUT the file first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/feed/home:
    get:
      tags: [feed]
      summary: Get the caller's home timeline
      description: |
        The caller's home feed: posts by followed authors plus the
        caller's own posts, **ranked per page** by the v1 recommender
        (recency decay + follow-graph boost + like velocity — see
        docs/recsys.md; engagement can move an older post above a newer
        one). Hybrid fan-out / fan-in (see docs/feeds.md): normal authors are fanned out to Valkey
        timelines on write; authors with more than FANOUT_THRESHOLD
        followers (default 10,000) are merged in from PostgreSQL at read
        time. Keyset-paginated — pass `next_cursor` for the next page;
        null `next_cursor` means the last page. A downed timeline store
        is 503 `feed_unavailable` with Retry-After (infrastructure
        outage, not a client bug); author timelines and post CRUD are
        unaffected. `?translate=xx` (E4) translates item bodies
        best-effort into the requested language — see the parameter docs.
      operationId: getHomeFeed
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/TranslateTarget'
      responses:
        '200':
          description: One page of the home feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPage'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Bad limit, malformed cursor, or unsupported translate target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: Wrong method — this route only supports GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Allow:
              description: Supported methods for this route
              schema:
                type: string
                example: GET
        '503':
          description: Timeline store unavailable — back off and retry.
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
                example: 5
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: feed_unavailable
                  message: home feed temporarily unavailable; please retry
                  request_id: 01J... (echoed)
  /v1/users/{id}/posts:
