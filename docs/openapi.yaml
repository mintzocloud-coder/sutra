  /v1/mini-apps:
    post:
      tags: [mini-apps]
      summary: Register a mini-app
      description: |
        Registers a new mini-app as a **draft** owned by the caller.
        The slug is first-come, first-served and immutable. The
        permission manifest must be a subset of the bridge allowlist
        (docs/mini-apps.md); anything else is rejected with
        `invalid_manifest`.
      operationId: registerMiniApp
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniAppRegister'
      responses:
        '201':
          description: Draft app registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniApp'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Invalid fields (`invalid_field`, `invalid_slug`, `invalid_manifest`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Slug already taken (`slug_taken`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [mini-apps]
      summary: Public mini-app directory
      description: |
        Lists **published** apps only, newest first, keyset-paginated
        (`limit` ≤ 100, opaque `cursor`). Draft, suspended and archived
        apps never appear here.
      operationId: listMiniApps
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Page size (default 20, max 100).
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: cursor
          in: query
          description: Opaque cursor from the previous page's `next_cursor`.
          schema:
            type: string
      responses:
        '200':
          description: Directory page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniAppDirectoryPage'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Bad pagination (`invalid_pagination`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/mini-apps/{id}:
    get:
      tags: [mini-apps]
      summary: Read a mini-app
      description: |
        Reads one registry row. Archived apps behave as not-found
        everywhere (`mini_app_not_found`).
      operationId: getMiniApp
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Mini-app UUID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The mini-app row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniApp'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such (or archived) app (`mini_app_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [mini-apps]
      summary: Update a mini-app
      description: |
        Owner-only partial update. Every field is optional; explicit
        `null` clears description/icon. Slug and status are not updatable
        here — status moves via publish/suspend/archive.
      operationId: updateMiniApp
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Mini-app UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniAppUpdate'
      responses:
        '200':
          description: Updated row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniApp'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Invalid fields or manifest (`invalid_field`, `invalid_manifest`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the developer (`not_owner`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such app (`mini_app_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [mini-apps]
      summary: Archive a mini-app
      description: |
        Owner-only. Archive is terminal: the row disappears everywhere,
        installs are deleted by the database cascade, and the slug stays
        tombstoned (never recycled).
      operationId: archiveMiniApp
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Mini-app UUID.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Archived.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the developer (`not_owner`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such app (`mini_app_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/mini-apps/{id}/publish:
    post:
      tags: [mini-apps]
      summary: Publish a mini-app
      description: |
        Owner-only. Moves draft → published (or suspended → published).
        Published apps become installable and appear in the directory.
      operationId: publishMiniApp
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Mini-app UUID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Published row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniApp'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Illegal transition (`invalid_status_transition`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the developer (`not_owner`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such app (`mini_app_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/mini-apps/{id}/suspend:
