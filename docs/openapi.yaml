  /v1/ads/campaigns:
    post:
      tags: [ads]
      summary: Create an ad campaign
      description: |
        Registers a new campaign as a **draft** owned by the caller's
        seller account. Nothing enters auctions until the advertiser
        explicitly activates it. `budget_paise` is integer paise
        (1..1,000,000,000 = ₹1..₹10cr); `daily_budget_paise` is optional
        and must not exceed the budget. Targeting keys are a closed set
        (`countries`, `languages`, `categories`, `devices`) — unknown
        keys fail loudly. Category slugs must exist in the catalog tree.
      operationId: createAdCampaign
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdCampaignCreate'
      responses:
        '201':
          description: Draft campaign created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdCampaign'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Invalid fields (`invalid_field`, `invalid_targeting`, `unknown_category`, `invalid_json`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a seller (`not_a_seller`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [ads]
      summary: List my ad campaigns
      description: |
        The caller's campaigns, newest first, keyset-paginated. Archived
        campaigns are excluded. Never returns another advertiser's data.
      operationId: listAdCampaigns
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Campaign page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdCampaignPage'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Bad pagination (`invalid_pagination`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a seller (`not_a_seller`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
