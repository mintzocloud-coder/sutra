  /v1/sellers:
    post:
      tags: [commerce]
      summary: Register a seller account
      description: |
        Registers a seller account for the caller (Wave-1 rule: one seller
        per user; a second registration is 409 `seller_already_registered`).
        The store slug is first-come, first-served and must match
        `[a-z0-9-]{3,30}` (no leading/trailing/double hyphens); when omitted
        it is derived from the store name. The store name is 3–80 runes
        (rune-counted so Indic-script names are measured fairly). GSTIN, when
        given, is validated as a 15-character GSTIN. The platform commission
        is 0% (`commission_rate_bps` default 0, Meesho-style marketplace).
      operationId: registerSeller
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerCreate'
            example:
              store_name: Shivam Electronics
              store_slug: shivam-electronics
              gstin: 24ABCDE1234F1Z5
      responses:
        '201':
          description: Seller registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seller'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          description: Malformed JSON body or unknown field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            `seller_already_registered` (caller already has a seller account)
            or `slug_taken` (another seller claimed the slug first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '422':
          description: |
            Validation failure — `invalid_store_name`, `invalid_slug`, or
            `invalid_gstin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/sellers/{id}:
    get:
      tags: [commerce]
